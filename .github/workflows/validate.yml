name: Validate Ansible
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SOPS/age test tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh release download v1.2.1 --repo FiloSottile/age \
              --pattern age-v1.2.1-linux-amd64.tar.gz --output "$RUNNER_TEMP/age.tar.gz" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
          echo '7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  '$RUNNER_TEMP'/age.tar.gz' \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
          sudo install -m 0755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
          for attempt in 1 2 3; do
            if gh release download v3.11.0 --repo getsops/sops \
              --pattern sops-v3.11.0.linux.amd64 --output "$RUNNER_TEMP/sops" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
          echo '775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef  '$RUNNER_TEMP'/sops' \
            | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops
      - name: Prepare the current Nginx configuration parser
        run: |
          docker pull nginx:1.28-alpine
          cat > "$RUNNER_TEMP/nginx-validator" <<'EOF'
          #!/bin/sh
          # Nginx -t creates temp directories; keep them owned by the test runner.
          exec docker run --rm --user "$(id -u):$(id -g)" \
            -v /tmp:/tmp --entrypoint nginx nginx:1.28-alpine -e stderr "$@"
          EOF
          chmod +x "$RUNNER_TEMP/nginx-validator"
          echo "NGINX_BIN=$RUNNER_TEMP/nginx-validator" >> "$GITHUB_ENV"
      - run: docker compose version
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the login browser checker
        run: npm install --prefix "$RUNNER_TEMP/authentik-browser" --no-audit --no-fund playwright-core@1.64.1
      - name: Check branded login navigation and native fallbacks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/authentik-browser/node_modules/playwright-core
        run: |
          export CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/authentik_login_browser.cjs
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/hou1.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/authentik-bootstrap.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/export-identity-profile.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/netbird-control-plane.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/netbird-dns.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/bootstrap-control-plane.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/backups.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/rehearse-recovery.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/restore-test-host.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/publish-test-recovery.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/monitoring.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/tls-renewal-access.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/tls-renewal-schedule.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/tls-renewal-peer.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/grafana-identity.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/restore-production-host.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory/inventory.yml ansible/playbooks/publish-production-recovery.yml --syntax-check
      - run: python -m unittest discover -s tests -v
