new_user_public_key: "{{ users_public_ssh }}"
hou1_wireguard_server_private_key: "{{ hou1_wg_private_key }}"
vpn_subnet: "10.10.0.0/24"
staff_vpn_subnet: "{{ vpn_subnet }}"

ansible_python_interpreter: /usr/bin/python3.11

# Safe defaults: enable dual VPNs first; switch management only after verification.
wireguard_enabled: true
netbird_enabled: false
management_vpn: wireguard
# Keep WireGuard for SSH recovery without CMS access after management cutover.
wireguard_cms_enabled: "{{ wireguard_enabled | bool and management_vpn == 'wireguard' }}"
netbird_management_url: "{{ 'https://' ~ netbird_domain if netbird_control_plane_enabled | bool else '' }}"
netbird_subnet: ""
netbird_ip: ""
netbird_interface: wt0
netbird_wireguard_port: 51821
# Optionally pin the exact APT version tested with your self-hosted server.
netbird_package_version: ""
netbird_enrollment_marker: /etc/netbird/ansible-enrollment.json
management_ip: "{{ netbird_ip if management_vpn == 'netbird' else hou1_vpn_ip }}"

# Opt in on the VPS that already runs the application Nginx.
netbird_control_plane_enabled: false
netbird_domain: ""
netbird_control_plane_directory: /opt/hou1-netbird
netbird_control_plane_project: hou1-netbird
netbird_server_image: netbirdio/netbird-server:0.82.0
netbird_dashboard_image: netbirdio/dashboard:v2.96.0
netbird_certbot_image: certbot/dns-cloudflare:v5.1.0
netbird_ingress_network: hou1-netbird-ingress
netbird_ingress_subnet: 172.30.80.0/29
netbird_ingress_proxy_ip: 172.30.80.2
netbird_bootstrap_allowed_cidrs: "{{ [vpn_subnet] }}"
netbird_backup_directory: /var/backups/hou1-netbird
