hou1_vpn_ip: "10.10.0.1"
# Use the declared NetBird address for management; retain WireGuard recovery.
netbird_enabled: true
management_vpn: netbird
netbird_ip: "{{ prod_netbird_ip }}"
netbird_server_group: prod-servers
certbot_mode: "http"
staff_domain: "staff.{{ primary_domain }}"
staff_cert_dir: "{{ primary_domain }}"
public_site_origin: "https://{{ primary_domain }}"
cms_environment: production
VAPID_PUBLIC_KEY: "{{ PROD_VAPID_PUBLIC_KEY }}"
VAPID_PRIVATE_KEY: "{{ PROD_VAPID_PRIVATE_KEY }}"
VAPID_SUBJECT: "{{ PROD_VAPID_SUBJECT }}"
STAFF_PASSWORD: "{{ PROD_STAFF_PASSWORD }}"
STAFF_SESSION_SECRET: "{{ PROD_STAFF_SESSION_SECRET }}"

ssl_domains:
  - { name: "{{ secondary_domain }}", flags: "-d {{ secondary_domain }} -d www.{{ secondary_domain }}" }
  - { name: "{{ primary_domain }}", flags: "-d {{ primary_domain }} -d www.{{ primary_domain }} -d {{ staff_domain }}" }
