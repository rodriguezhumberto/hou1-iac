netbird_ip: "{{ test_netbird_ip }}"
netbird_server_group: test-servers

certbot_mode: "dns"
staff_domain: "staff-test.{{ primary_domain }}"
staff_cert_dir: "test.{{ primary_domain }}"
public_site_origin: "https://test.{{ primary_domain }}"
cms_environment: test
VAPID_PUBLIC_KEY: "{{ TEST_VAPID_PUBLIC_KEY }}"
VAPID_PRIVATE_KEY: "{{ TEST_VAPID_PRIVATE_KEY }}"
VAPID_SUBJECT: "{{ TEST_VAPID_SUBJECT }}"
STAFF_PASSWORD: "{{ TEST_STAFF_PASSWORD }}"
STAFF_SESSION_SECRET: "{{ TEST_STAFF_SESSION_SECRET }}"

ssl_domains:
  - { name: "test.{{ primary_domain }}", flags: "-d test.{{ primary_domain }} -d *.test.{{ primary_domain }} -d {{ staff_domain }}" }
