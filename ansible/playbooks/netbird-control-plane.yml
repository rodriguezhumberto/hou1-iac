---
- name: Deploy NetBird beside the existing HOU1 application
  hosts: "{{ target_hosts | default('hou1_prod') }}"
  become: true
  pre_tasks:
    - name: Require explicit control-plane enablement
      ansible.builtin.assert:
        that: netbird_control_plane_enabled | bool
        fail_msg: Set netbird_control_plane_enabled=true in this host's environment configuration first.
    - name: Validate VPN and colocated control-plane configuration
      ansible.builtin.import_role:
        name: vpn_config
  roles:
    - role: docker
    - role: netbird_control_plane
