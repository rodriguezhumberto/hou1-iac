---
- name: Rehearse the encrypted HOU1 backup in isolated containers
  hosts: "{{ target_hosts | default('isolated_test_vps') }}"
  become: true
  gather_facts: false
  serial: 1
  pre_tasks:
    - name: Validate inventory targeting before any connection or controller changes
      ansible.builtin.import_tasks: tasks/validate-target.yml
      tags: [always]

  roles:
    - role: recovery_drill
