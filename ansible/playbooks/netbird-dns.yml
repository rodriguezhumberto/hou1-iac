---
- name: Deploy private DNS on the NetBird control-plane host
  hosts: netbird_control_plane
  become: true
  module_defaults:
    ansible.builtin.uri:
      use_proxy: false
      follow_redirects: none
  pre_tasks:
    - name: Validate NetBird management
      ansible.builtin.import_role:
        name: netbird_common
      tags: [always]
    - name: Require the dedicated production target
      ansible.builtin.import_tasks: roles/netbird_control_plane/tasks/target.yml
      tags: [always]
  roles:
    - role: netbird_client
    - role: netbird_dns
