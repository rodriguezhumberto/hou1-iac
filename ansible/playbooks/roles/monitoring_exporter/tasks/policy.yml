---
- name: Reconcile the exact metrics source and destination without broadening shared policies
  delegate_to: localhost
  become: false
  no_log: true
  block:
    - name: Read enrolled peers and existing policy state
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/{{ item }}'
        headers: '{{ netbird_api_headers }}'
        status_code: 200
      loop: [groups, peers, policies]
      register: hou1_monitoring_api

    - name: Plan the two exact metrics groups
      ansible.builtin.set_fact:
        hou1_metrics_plan: '{{ hou1_monitoring_api.results[0].json | netbird_monitoring_plan(hou1_monitoring_api.results[1].json, hou1_monitoring_api.results[2].json, hou1_monitoring_peer_ip, netbird_ip, netbird_subnet, netbird_server_group) }}'

    - name: Create only missing metrics peer groups
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/groups'
        headers: '{{ netbird_api_headers }}'
        method: POST
        body_format: json
        body: '{{ item.body }}'
        status_code: 200
      loop: '{{ hou1_metrics_plan.groups }}'
      when: item.id is none
      changed_when: true

    - name: Read back exact metrics groups
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/groups'
        headers: '{{ netbird_api_headers }}'
        status_code: 200
      register: hou1_metrics_groups

    - name: Plan the single direction and single port policy
      ansible.builtin.set_fact:
        hou1_metrics_plan: '{{ hou1_metrics_groups.json | netbird_monitoring_plan(hou1_monitoring_api.results[1].json, hou1_monitoring_api.results[2].json, hou1_monitoring_peer_ip, netbird_ip, netbird_subnet, netbird_server_group) }}'

    - name: Apply only the marked metrics policy
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/policies{{ "/" ~ hou1_metrics_plan.policy.id if hou1_metrics_plan.policy.id else "" }}'
        headers: '{{ netbird_api_headers }}'
        method: '{{ "PUT" if hou1_metrics_plan.policy.id else "POST" }}'
        body_format: json
        body: '{{ hou1_metrics_plan.policy.body }}'
        status_code: 200
      when: hou1_metrics_plan.policy.changed
      changed_when: true

    - name: Verify metrics policy readback
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/policies'
        headers: '{{ netbird_api_headers }}'
        status_code: 200
      register: hou1_metrics_policies

    - name: Require exact policy contents and membership after reconciliation
      ansible.builtin.assert:
        that: not (hou1_metrics_groups.json | netbird_monitoring_plan(hou1_monitoring_api.results[1].json, hou1_metrics_policies.json, hou1_monitoring_peer_ip, netbird_ip, netbird_subnet, netbird_server_group)).policy.changed

    - name: Plan optional HTTPS access using only the two exact metrics peers
      ansible.builtin.set_fact:
        hou1_probe_policy: '{{ hou1_metrics_groups.json | netbird_staff_probe_plan(hou1_monitoring_api.results[1].json, hou1_metrics_policies.json, hou1_monitoring_peer_ip, netbird_ip, netbird_subnet, netbird_server_group, hou1_staff_probe_enabled | default(false)) }}'

    - name: Reconcile only the marked single-port staff probe policy
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/policies{{ "/" ~ hou1_probe_policy.id if hou1_probe_policy.id else "" }}'
        headers: '{{ netbird_api_headers }}'
        method: '{{ "PUT" if hou1_probe_policy.id else "POST" }}'
        body_format: json
        body: '{{ hou1_probe_policy.body }}'
        status_code: 200
      when: hou1_probe_policy is not none and hou1_probe_policy.changed
      changed_when: true

    - name: Read back the optional staff probe policy
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/policies'
        headers: '{{ netbird_api_headers }}'
        status_code: 200
      register: hou1_probe_policies
      when: hou1_probe_policy is not none

    - name: Require exact optional HTTPS policy readback
      ansible.builtin.assert:
        that: not (hou1_metrics_groups.json | netbird_staff_probe_plan(hou1_monitoring_api.results[1].json, hou1_probe_policies.json, hou1_monitoring_peer_ip, netbird_ip, netbird_subnet, netbird_server_group, hou1_staff_probe_enabled | default(false))).changed
      when: hou1_probe_policy is not none
