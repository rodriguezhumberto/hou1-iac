---
- name: Require an explicit environment and private metrics target
  ansible.builtin.assert:
    that:
      - hou1_monitoring_enabled is boolean and hou1_monitoring_enabled
      - cms_environment in ['test', 'production']
      - hou1_monitoring_identity_profile in ['test', 'prod']
      - hou1_monitoring_identity_profile in authentik_identity_profiles
      - groups.get(hou1_monitoring_inventory_group, []) == [inventory_hostname]
      - ansible_play_hosts_all == [inventory_hostname]
      - >-
        (cms_environment == 'test' and inventory_hostname not in groups.get('prod_env', []) and
         netbird_server_group == 'test-servers') or
        (cms_environment == 'production' and inventory_hostname in groups.get('prod_env', []) and
         netbird_server_group == 'prod-servers')
      - ansible_host == netbird_ip
      - not (node_bootstrap | bool)
      - hou1_monitoring_peer_ip is ansible.utils.ipv4
      - "'/' not in hou1_monitoring_peer_ip"
      - (hou1_monitoring_peer_ip | ansible.utils.ipaddr(netbird_subnet)) is truthy
      - hou1_monitoring_peer_ip != netbird_ip
      - hou1_monitoring_peer_ip != (netbird_subnet | ansible.utils.ipaddr('network'))
      - hou1_monitoring_peer_ip != (netbird_subnet | ansible.utils.ipaddr('broadcast'))
      - hou1_monitoring_exporter_port == 9100
      - hou1_request_metrics_enabled is boolean
      - not ansible_check_mode
    fail_msg: Select one matching environment inventory group, identity profile and HOU4 VPN peer.

- name: Require sources to match the selected deployment
  ansible.builtin.assert:
    that:
      - authentik_identity_profiles[hou1_monitoring_identity_profile].environment == hou1_monitoring_identity_profile
      - cms_environment == ('test' if hou1_monitoring_identity_profile == 'test' else 'production')
      - netbird_subnet == authentik_identity_profiles[hou1_monitoring_identity_profile].netbird_subnet
      - hou1_monitoring_backup_directory == authentik_backup_root_base ~ '/' ~ hou1_monitoring_identity_profile
      - hou1_request_metrics_log == app_directory ~ '/nginx-logs/metrics.jsonl'
      - hou1_monitoring_containers | length == 7
      - >-
        hou1_monitoring_containers.postgresql == {'directory': authentik_project_root_base ~ '/' ~ hou1_monitoring_identity_profile, 'service': 'postgresql'}
      - >-
        hou1_monitoring_containers['authentik-server'] == {'directory': authentik_project_root_base ~ '/' ~ hou1_monitoring_identity_profile, 'service': 'authentik-server'}
      - >-
        hou1_monitoring_containers['authentik-worker'] == {'directory': authentik_project_root_base ~ '/' ~ hou1_monitoring_identity_profile, 'service': 'authentik-worker'}
      - >-
        hou1_monitoring_containers['staff-app'] == {'directory': app_directory, 'service': 'astro-app'}
      - >-
        hou1_monitoring_containers.nginx == {'directory': app_directory, 'service': 'nginx'}
      - >-
        hou1_monitoring_containers.netbird == {'directory': netbird_control_plane_directory, 'service': 'netbird-server'}
      - >-
        hou1_monitoring_containers['netbird-dashboard'] == {'directory': netbird_control_plane_directory, 'service': 'dashboard'}
      - app_directory is match('^/[a-zA-Z0-9_/-]+$')
      - netbird_control_plane_directory is match('^/[a-zA-Z0-9_/-]+$')
    fail_msg: Metrics must use the declared Compose deployment roots and credential-free log.
  no_log: true

- name: Prepare controller API context without reenrolling any peer
  ansible.builtin.import_tasks: ../../netbird_client/tasks/api-context.yml

- name: Reconcile only the two metrics peer groups and their single-port policy
  ansible.builtin.import_tasks: policy.yml

- name: Install dependencies through existing package access policy
  ansible.builtin.include_tasks: ../../rehearsal_gates/tasks/package-access.yml
  vars:
    rehearsal_package_tasks: '{{ role_path }}/tasks/packages.yml'

- name: Create protected metrics directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: root
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - {path: /var/lib/hou1-monitoring, group: root, mode: '0700'}
    - {path: /etc/hou1-monitoring, group: root, mode: '0700'}
    - {path: /usr/local/libexec, group: root, mode: '0755'}
    - {path: /var/lib/prometheus/node-exporter, group: prometheus, mode: '0750'}
    - {path: /etc/systemd/system/prometheus-node-exporter.service.d, group: root, mode: '0755'}

- name: Configure the read-only aggregate sources
  ansible.builtin.copy:
    dest: /etc/hou1-monitoring/collector.json
    owner: root
    group: root
    mode: '0600'
    content: "{{ {'environment': cms_environment, 'containers': hou1_monitoring_containers, 'authentik_backup_directory': hou1_monitoring_backup_directory, 'request_metrics_enabled': hou1_request_metrics_enabled, 'request_metrics_log': hou1_request_metrics_log} | to_nice_json }}"
  no_log: true

- name: Install the read-only aggregate collector
  ansible.builtin.copy:
    src: collect.py
    dest: /usr/local/libexec/hou1-monitoring-collect
    owner: root
    group: root
    mode: '0700'

- name: Install the credential-free request aggregate helper
  ansible.builtin.copy:
    src: request_metrics.py
    dest: /usr/local/libexec/request_metrics.py
    owner: root
    group: root
    mode: '0600'

- name: Install bounded metrics log rotation
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/hou1-monitoring/logrotate.conf
    owner: root
    group: root
    mode: '0600'
  when: hou1_request_metrics_enabled
  no_log: true

- name: Check metric log size and retention hourly
  ansible.builtin.cron:
    name: HOU1 isolated credential-free metrics log rotation
    minute: '17'
    job: /usr/sbin/logrotate --state /var/lib/hou1-monitoring/logrotate.state /etc/hou1-monitoring/logrotate.conf
    state: "{{ 'present' if hou1_request_metrics_enabled else 'absent' }}"

- name: Configure the private exporter and textfile directory
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: '0644'
    content: |
      ARGS="--web.listen-address={{ netbird_ip }}:9100 --collector.textfile.directory=/var/lib/prometheus/node-exporter"
  notify: Restart private node exporter

- name: Wait for the VPN address on exporter startup
  ansible.builtin.template:
    src: exporter.conf.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/20-netbird.conf
    mode: '0644'
  notify: Restart private node exporter

- name: Install the collector unit
  ansible.builtin.template:
    src: collector.service.j2
    dest: /etc/systemd/system/hou1-monitoring-collect.service
    mode: '0644'
  register: hou1_collector_unit

- name: Install the minutely collector timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/hou1-monitoring-collect.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Refresh HOU1 monitoring aggregates every minute
      [Timer]
      OnCalendar=minutely
      Persistent=true
      [Install]
      WantedBy=timers.target
  register: hou1_collector_timer

- name: Apply service changes before first collection
  ansible.builtin.meta: flush_handlers

- name: Enable the private node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    daemon_reload: true
    enabled: true
    state: started

- name: Allow metrics only from the declared HOU4 peer on the VPN interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: '{{ netbird_interface }}'
    from_ip: '{{ hou1_monitoring_peer_ip }}'
    to_ip: '{{ netbird_ip }}'
    to_port: '9100'
    proto: tcp

- name: Run one complete read-only collection before enabling its timer
  ansible.builtin.command: /usr/local/libexec/hou1-monitoring-collect
  changed_when: false

- name: Enable periodic collection
  ansible.builtin.systemd_service:
    name: hou1-monitoring-collect.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Require one exact private metrics listener
  ansible.builtin.command: ss -Hln 'sport = :9100'
  register: hou1_exporter_sockets
  changed_when: false
  failed_when: >-
    (hou1_exporter_sockets.stdout | regex_findall('\S+:9100(?=\s)') | unique | list) != [netbird_ip ~ ':9100']
