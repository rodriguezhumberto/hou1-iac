---
- name: Require a real run for enrollment and address verification
  ansible.builtin.assert:
    that: not ansible_check_mode
    fail_msg: NetBird enrollment cannot run in check mode. Use syntax-check and the offline validation suite instead.

- name: Install NetBird repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Download the NetBird repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /usr/share/keyrings/netbird.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure the signed NetBird APT repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/netbird.asc] https://pkgs.netbird.io/debian stable main
    filename: netbird
    state: present

- name: Install the NetBird CLI
  ansible.builtin.apt:
    name: "{{ 'netbird=' ~ netbird_package_version if netbird_package_version | length else 'netbird' }}"
    state: present
    update_cache: true

- name: Enable and start NetBird
  ansible.builtin.systemd:
    name: netbird
    enabled: true
    state: started

- name: Read NetBird enrollment status
  ansible.builtin.command: netbird status --json
  register: netbird_before
  changed_when: false
  check_mode: false

- name: Decode NetBird status
  ansible.builtin.set_fact:
    netbird_before_status: "{{ netbird_before.stdout | from_json }}"

- name: Check for a previously verified enrollment
  ansible.builtin.stat:
    path: "{{ netbird_enrollment_marker }}"
  register: netbird_marker_stat

- name: Read the enrollment record
  ansible.builtin.slurp:
    src: "{{ netbird_enrollment_marker }}"
  register: netbird_marker
  when: netbird_marker_stat.stat.exists

- name: Decide whether first enrollment is required
  ansible.builtin.set_fact:
    netbird_needs_enrollment: >-
      {{ not netbird_marker_stat.stat.exists and
         not (netbird_before_status.netbirdIp | default('') | length) }}

- name: Refuse to change the recorded enrollment endpoint
  ansible.builtin.assert:
    that:
      - >-
        ((netbird_marker.content | b64decode | from_json).management_url | regex_replace('/$', '')) ==
        (netbird_management_url | regex_replace('/$', ''))
    fail_msg: The existing enrollment record belongs to another management server.
  when: netbird_marker_stat.stat.exists

- name: Refuse to move an enrolled peer to another management server
  ansible.builtin.assert:
    that:
      - >-
        not (netbird_before_status.netbirdIp | default('') | length) or
        (netbird_before_status.management.url | regex_replace('/$', '')) ==
        (netbird_management_url | regex_replace('/$', ''))
    fail_msg: This peer belongs to another management server. Migrate its identity explicitly.

- name: Require a setup key only for first enrollment
  ansible.builtin.assert:
    that:
      - netbird_setup_key | default('') | length > 0
    fail_msg: Supply a one-off non-ephemeral setup key through Ansible Vault for first enrollment.
  when: netbird_needs_enrollment | bool
  no_log: true

- name: Configure and connect the persistent peer
  block:
    - name: Create a temporary enrollment key file
      ansible.builtin.tempfile:
        state: file
        prefix: netbird-enrollment-
      register: netbird_key_file
      when: netbird_needs_enrollment | bool

    - name: Write the one-off key without exposing it in process arguments
      ansible.builtin.copy:
        dest: "{{ netbird_key_file.path }}"
        content: "{{ netbird_setup_key }}"
        owner: root
        group: root
        mode: '0600'
      when: netbird_needs_enrollment | bool
      no_log: true

    - name: Connect to the self-hosted management server
      ansible.builtin.command:
        argv: >-
          {{ ['timeout', '90', 'netbird', 'up',
              '--management-url', netbird_management_url,
              '--interface-name', netbird_interface,
              '--wireguard-port', netbird_wireguard_port | string,
              '--disable-dns', '--no-browser'] +
             (['--setup-key-file', netbird_key_file.path]
              if netbird_needs_enrollment | bool else []) }}
      register: netbird_up
      changed_when: >-
        not (netbird_before_status.management.connected | default(false)) or
        netbird_before_status.wireguardPort | default(0) | int != netbird_wireguard_port | int
      no_log: true
  always:
    - name: Remove the temporary enrollment key even on failure
      ansible.builtin.file:
        path: "{{ netbird_key_file.path }}"
        state: absent
      when: netbird_key_file.path is defined
      no_log: true

- name: Wait for the enrolled peer to connect
  ansible.builtin.command: netbird status --json
  register: netbird_after
  changed_when: false
  until: (netbird_after.stdout | from_json).management.connected | default(false)
  retries: 12
  delay: 5

- name: Verify the management server and actual listening port
  ansible.builtin.assert:
    that:
      - >-
        ((netbird_after.stdout | from_json).management.url | regex_replace('/$', '')) ==
        (netbird_management_url | regex_replace('/$', ''))
      - (netbird_after.stdout | from_json).wireguardPort | int == netbird_wireguard_port | int

- name: Read the NetBird interface address
  ansible.builtin.command:
    argv: [ip, -j, -4, address, show, dev, "{{ netbird_interface }}"]
  register: netbird_interface_state
  changed_when: false

- name: Verify the peer belongs to the configured subnet
  ansible.builtin.assert:
    that:
      - >-
        ((netbird_interface_state.stdout | from_json | first).addr_info |
         map(attribute='local') | select('ansible.utils.in_network', netbird_subnet) | list | length) > 0
      - >-
        not (netbird_ip | length) or netbird_ip in
        ((netbird_interface_state.stdout | from_json | first).addr_info | map(attribute='local') | list)
    fail_msg: The actual peer address does not match netbird_subnet/netbird_ip. Do not cut over inventory.


- name: Record verified enrollment for unattended reconnects after daemon restarts
  ansible.builtin.copy:
    dest: "{{ netbird_enrollment_marker }}"
    content: "{{ {'management_url': netbird_management_url} | to_nice_json }}\n"
    owner: root
    group: root
    mode: '0600'
