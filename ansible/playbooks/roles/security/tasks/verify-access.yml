---
# A fresh connection avoids accepting an already-open bootstrap or VPN session.
- name: Connect as the administrative user over NetBird from the controller
  ansible.builtin.command:
    argv: >-
      {{ ['ssh'] + (security_netbird_ssh_options | default(['-o', 'StrictHostKeyChecking=accept-new'])) + [
        '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=10',
        '-o', 'ControlMaster=no', '-o', 'ControlPath=none',
        '-i', ansible_ssh_private_key_file | default('~/.ssh/id_ed25519') | expanduser,
        new_user ~ '@' ~ netbird_ip, 'sudo -n true'] }}
  delegate_to: localhost
  become: false
  changed_when: false
