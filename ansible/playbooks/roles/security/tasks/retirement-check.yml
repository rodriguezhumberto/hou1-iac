---
- name: Check for the legacy VPN configuration
  ansible.builtin.stat:
    path: /etc/wireguard/wg0.conf
  register: ssh_legacy_vpn_config

- name: Inspect installed network interfaces before changing SSH
  ansible.builtin.command:
    argv: [ip, -j, link, show]
  register: ssh_network_interfaces
  changed_when: false

- name: Require verified retirement before removing legacy SSH recovery
  ansible.builtin.assert:
    that:
      - >-
        netbird_retirement_verified | default(false) | bool or
        (not ssh_legacy_vpn_config.stat.exists and
         not (ssh_network_interfaces.stdout | from_json |
              selectattr('ifname', 'equalto', 'wg0') | list | length))
    fail_msg: >-
      This host still has a WireGuard configuration or wg0 interface. Complete
      the rollout and console recovery checks in docs/netbird-operations.md,
      then run retire-wireguard.yml with netbird_retirement_verified=true.
      SSH listeners and startup configuration have not been changed.
