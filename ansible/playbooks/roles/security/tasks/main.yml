---
- name: Set SSH authentication policy before provider overrides
  copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-security.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible; loaded before provider and cloud-init settings.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Restrict SSH ListenAddress to WireGuard VPN
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ListenAddress'
    line: 'ListenAddress {{ hou1_vpn_ip }}'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Allow UFW Ports
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: '51820', proto: 'udp' }
    - { port: '80', proto: 'tcp' }
    - { port: '443', proto: 'tcp' }

- name: Allow SSH from the VPN subnet only through WireGuard
  ufw:
    rule: allow
    direction: in
    interface: wg0
    port: '22'
    proto: tcp
    src: "{{ vpn_subnet }}"

- name: Remove the legacy source-only SSH allowance
  ufw:
    delete: yes
    rule: allow
    port: '22'
    proto: tcp
    src: "{{ vpn_subnet }}"

- name: Enable UFW and set default deny incoming
  ufw:
    state: enabled
    direction: incoming
    policy: deny
