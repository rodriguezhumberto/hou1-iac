---
- name: Disable Root SSH Login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Restrict SSH ListenAddress to WireGuard VPN
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ListenAddress'
    line: 'ListenAddress {{ hou1_vpn_ip }}'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Disable SSH Password Authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Allow UFW Ports
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: '51820', proto: 'udp' }
    - { port: '80', proto: 'tcp' }
    - { port: '443', proto: 'tcp' }

- name: Allow SSH strictly from the WireGuard VPN subnet
  ufw:
    rule: allow
    port: '22'
    proto: tcp
    src: '10.10.0.0/24'

- name: Enable UFW and set default deny incoming
  ufw:
    state: enabled
    direction: incoming
    policy: deny