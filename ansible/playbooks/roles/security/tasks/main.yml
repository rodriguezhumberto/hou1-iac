---
- name: Set SSH authentication policy before provider overrides
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-security.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible; loaded before provider and cloud-init settings.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Allow public HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['80', '443']

- name: Manage legacy WireGuard ingress
  community.general.ufw:
    rule: allow
    port: '51820'
    proto: udp
    delete: "{{ not (wireguard_enabled | bool) }}"

- name: Manage SSH access through WireGuard
  community.general.ufw:
    rule: allow
    direction: in
    interface: wg0
    port: '22'
    proto: tcp
    src: "{{ vpn_subnet }}"
    delete: "{{ not (wireguard_enabled | bool) }}"

- name: Allow SSH through NetBird
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ netbird_interface }}"
    port: '22'
    proto: tcp
    src: "{{ netbird_subnet }}"
  when: netbird_enabled | bool

- name: Remove the legacy source-only SSH allowance
  community.general.ufw:
    delete: true
    rule: allow
    port: '22'
    proto: tcp
    src: "{{ vpn_subnet }}"

- name: Enable UFW and set default deny incoming
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Create the SSH service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Retry SSH startup while private VPN addresses become available
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.service.d/vpn.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      After={{ 'wg-quick@wg0.service ' if wireguard_enabled | bool else '' }}{{ 'netbird.service' if netbird_enabled | bool else '' }}
      StartLimitIntervalSec=0
      [Service]
      Restart=on-failure
      RestartSec=5s
  register: ssh_vpn_unit

- name: Reload systemd after updating SSH startup ordering
  ansible.builtin.systemd:
    daemon_reload: true
  when: ssh_vpn_unit.changed

# Explicit addresses avoid exposing SSH publicly even if another firewall tool
# changes its rules. Leave wg0 listening throughout the dual-VPN stage.
- name: Require a known peer address before changing SSH listeners
  ansible.builtin.assert:
    that:
      - netbird_ip is ansible.utils.ipv4
      - "'/' not in netbird_ip"
      - netbird_ip is ansible.utils.in_network(netbird_subnet)
    fail_msg: Enroll with --tags netbird, then set this host's netbird_ip before running security.
  when: netbird_enabled | bool

- name: Configure explicit private SSH listeners with rollback on validation failure
  block:
    - name: Back up the current SSH configuration in memory
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: ssh_config_before

    - name: Write the private VPN listeners and preserve other SSH settings
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config
        content: "{{ lookup('ansible.builtin.template', 'sshd_config.j2') }}"
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH

    - name: Read the effective SSH configuration including provider overrides
      ansible.builtin.command: /usr/sbin/sshd -T
      register: ssh_effective_config
      changed_when: false
      check_mode: false

    - name: Reject listeners outside the selected private VPN addresses
      ansible.builtin.assert:
        that:
          - >-
            (ssh_effective_config.stdout_lines | select('match', '^listenaddress ') |
             map('regex_replace', '^listenaddress (.*):[0-9]+$', '\\1') | list |
             difference(([hou1_vpn_ip] if wireguard_enabled | bool else []) +
                        ([netbird_ip] if netbird_enabled | bool else [])) | length) == 0
        fail_msg: An included SSH configuration exposes an unexpected listener. Remove that override first.
      when: not ansible_check_mode
  rescue:
    - name: Restore SSH configuration after invalid listener change
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config
        content: "{{ ssh_config_before.content | b64decode }}"
        owner: root
        group: root
        mode: '0644'
      when: ssh_config_before.content is defined

    - name: Stop without applying the invalid SSH configuration
      ansible.builtin.fail:
        msg: SSH listener validation failed; the previous configuration was restored.
