---
- name: Validate host management before changing access
  ansible.builtin.import_role:
    name: netbird_common

- name: Guard retirement of an existing WireGuard recovery path
  ansible.builtin.import_tasks: retirement-check.yml

- name: Allow public HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['80', '443']

- name: Allow SSH through NetBird
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ netbird_interface }}"
    port: '22'
    proto: tcp
    src: "{{ netbird_subnet }}"

- name: Record the public bootstrap address before changing the SSH path
  ansible.builtin.set_fact:
    ssh_bootstrap_public_ip: "{{ ansible_host }}"
  when: node_bootstrap | bool

- name: Snapshot the existing SSH startup override before changing it
  ansible.builtin.stat:
    path: /etc/systemd/system/ssh.service.d/vpn.conf
  register: ssh_vpn_unit_before_stat

- name: Read the existing SSH startup override
  ansible.builtin.slurp:
    src: /etc/systemd/system/ssh.service.d/vpn.conf
  register: ssh_vpn_unit_before
  when: ssh_vpn_unit_before_stat.stat.exists

- name: Check for a stale bootstrap SSH fallback on established hosts
  ansible.builtin.stat:
    path: /etc/systemd/system/ansible-ssh-bootstrap-fallback.timer
  register: ssh_bootstrap_fallback_timer_stat

- name: Stop a stale bootstrap SSH fallback on established hosts
  ansible.builtin.systemd:
    name: ansible-ssh-bootstrap-fallback.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - not (node_bootstrap | bool)
    - ssh_bootstrap_fallback_timer_stat.stat.exists

- name: Remove stale bootstrap SSH fallback files on established hosts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/ansible-ssh-bootstrap-fallback
    - /etc/systemd/system/ansible-ssh-bootstrap-fallback.service
    - /etc/systemd/system/ansible-ssh-bootstrap-fallback.timer
    - /etc/ssh/sshd_config.d/01-ansible-bootstrap-fallback.conf
    - "{{ ssh_bootstrap_fallback_dir }}"
  when:
    - not (node_bootstrap | bool)
    - ssh_bootstrap_fallback_timer_stat.stat.exists

- name: Create the bootstrap SSH fallback state directory
  ansible.builtin.file:
    path: "{{ ssh_bootstrap_fallback_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: node_bootstrap | bool

- name: Save the public SSH configuration for timer recovery
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: "{{ ssh_bootstrap_fallback_dir }}/sshd_config"
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when: node_bootstrap | bool

- name: Save the existing SSH startup override for timer recovery
  ansible.builtin.copy:
    src: /etc/systemd/system/ssh.service.d/vpn.conf
    dest: "{{ ssh_bootstrap_fallback_dir }}/vpn.conf"
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when:
    - node_bootstrap | bool
    - ssh_vpn_unit_before_stat.stat.exists | default(false)

- name: Remove a stale saved SSH startup override
  ansible.builtin.file:
    path: "{{ ssh_bootstrap_fallback_dir }}/vpn.conf"
    state: absent
  when:
    - node_bootstrap | bool
    - not (ssh_vpn_unit_before_stat.stat.exists | default(false))

- name: Install the public SSH fallback script
  ansible.builtin.template:
    src: bootstrap-ssh-fallback.sh.j2
    dest: /usr/local/sbin/ansible-ssh-bootstrap-fallback
    owner: root
    group: root
    mode: '0755'
  when: node_bootstrap | bool

- name: Install the public SSH fallback service
  ansible.builtin.template:
    src: bootstrap-ssh-fallback.service.j2
    dest: /etc/systemd/system/ansible-ssh-bootstrap-fallback.service
    owner: root
    group: root
    mode: '0644'
  when: node_bootstrap | bool

- name: Install the public SSH fallback timer
  ansible.builtin.template:
    src: bootstrap-ssh-fallback.timer.j2
    dest: /etc/systemd/system/ansible-ssh-bootstrap-fallback.timer
    owner: root
    group: root
    mode: '0644'
  when: node_bootstrap | bool

- name: Arm the public SSH fallback before the NetBird cutover
  ansible.builtin.systemd:
    name: ansible-ssh-bootstrap-fallback.timer
    daemon_reload: true
    enabled: true
    state: started
  when: node_bootstrap | bool

- name: Create the SSH service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Retry SSH startup while the NetBird address becomes available
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.service.d/vpn.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Wants=netbird.service
      After=netbird.service
      StartLimitIntervalSec=0
      [Service]
      ExecStartPre=/bin/sh -c 'until /usr/sbin/ip -4 addr show dev {{ netbird_interface }} | /bin/grep -Fq "inet {{ netbird_ip }}/"; do /bin/sleep 1; done'
      Restart=on-failure
      RestartSec=5s
  register: ssh_vpn_unit

- name: Reload systemd after updating SSH startup ordering
  ansible.builtin.systemd:
    daemon_reload: true
  when: ssh_vpn_unit.changed

- name: Configure NetBird SSH listeners with rollback on validation failure
  block:
    - name: Back up the current SSH configuration in memory
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: ssh_config_before

    - name: Write the NetBird listener and preserve other SSH settings
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config
        content: "{{ lookup('ansible.builtin.template', 'sshd_config.j2') }}"
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s

    - name: Reload the running SSH daemon for the NetBird listener
      ansible.builtin.systemd:
        name: ssh
        state: reloaded

    - name: Read the effective SSH configuration including provider overrides
      ansible.builtin.command: /usr/sbin/sshd -T
      register: ssh_effective_config
      changed_when: false

    - name: Verify private SSH listeners
      ansible.builtin.import_tasks: verify-listeners.yml

    - name: Read active SSH sockets
      ansible.builtin.command: ss -Hln 'sport = :22'
      register: ssh_active_listeners
      changed_when: false

    - name: Require the running daemon to listen only on NetBird
      ansible.builtin.assert:
        that:
          - >-
            (ssh_active_listeners.stdout | regex_findall('\S+:22(?=\s)') | unique | list) == [netbird_ip ~ ':22']
        fail_msg: Active SSH sockets include an unexpected listener. Check ssh.socket and provider overrides.

    - name: Verify a fresh administrative SSH connection through NetBird
      ansible.builtin.import_tasks: verify-access.yml

    - name: Mark the public SSH fallback cancelled after NetBird validation
      ansible.builtin.file:
        path: "{{ ssh_bootstrap_fallback_dir }}/cancelled"
        state: touch
        owner: root
        group: root
        mode: '0600'
      when: node_bootstrap | bool

    - name: Disarm the public SSH fallback after NetBird validation
      ansible.builtin.systemd:
        name: ansible-ssh-bootstrap-fallback.timer
        enabled: false
        state: stopped
        daemon_reload: true
      when: node_bootstrap | bool

    - name: Remove the completed bootstrap SSH fallback
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/sbin/ansible-ssh-bootstrap-fallback
        - /etc/systemd/system/ansible-ssh-bootstrap-fallback.service
        - /etc/systemd/system/ansible-ssh-bootstrap-fallback.timer
        - /etc/ssh/sshd_config.d/01-ansible-bootstrap-fallback.conf
        - "{{ ssh_bootstrap_fallback_dir }}"
      when: node_bootstrap | bool
  rescue:
    - name: Restore SSH configuration after invalid listener change
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config
        content: "{{ ssh_config_before.content | b64decode }}"
        owner: root
        group: root
        mode: '0644'
      when: ssh_config_before.content is defined

    - name: Reload the restored SSH configuration
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when: ssh_config_before.content is defined

    - name: Restore the previous SSH startup override
      ansible.builtin.copy:
        dest: /etc/systemd/system/ssh.service.d/vpn.conf
        content: "{{ ssh_vpn_unit_before.content | b64decode }}"
        owner: root
        group: root
        mode: '0644'
      when:
        - ssh_vpn_unit_before_stat.stat.exists
        - ssh_vpn_unit_before.content is defined

    - name: Remove the new SSH startup override after a failed bootstrap
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.service.d/vpn.conf
        state: absent
      when: not ssh_vpn_unit_before_stat.stat.exists

    - name: Reload systemd after restoring the SSH startup override
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload SSH with the restored startup ordering
      ansible.builtin.systemd:
        name: ssh
        state: reloaded

    - name: Stop after restoring the previous listener
      ansible.builtin.fail:
        msg: >-
          NetBird SSH validation failed; public SSH on {{ ssh_bootstrap_public_ip | default(ansible_host) }}
          was restored and reloaded. Retry the initialization over that public address.

- name: Switch initialized hosts to administrative NetBird access
  ansible.builtin.set_fact:
    ansible_host: "{{ netbird_ip }}"
    ansible_user: "{{ new_user }}"
    ansible_ssh_pass: ''
    ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file | default('~/.ssh/id_ed25519') }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
    node_bootstrap: false
  register: ssh_bootstrap_handoff
  when: node_bootstrap | bool

- name: Close the public bootstrap connection
  ansible.builtin.meta: reset_connection
  when: ssh_bootstrap_handoff is not skipped

- name: Set SSH authentication policy before provider overrides
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-security.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible; loaded before provider and cloud-init settings.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Remove public SSH allowances
  community.general.ufw:
    delete: true
    rule: allow
    port: '22'
    proto: "{{ item }}"
  loop: [tcp, any]

- name: Remove public SSH profile allowances
  community.general.ufw:
    delete: true
    rule: allow
    name: OpenSSH

- name: Enable UFW and set default deny incoming
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
