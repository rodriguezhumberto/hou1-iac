---
- name: Validate the declared Authentik ingress attachment
  ansible.builtin.import_tasks: ingress-inputs.yml

- name: Derive the environment-specific public Authentik hostname
  ansible.builtin.set_fact:
    authentik_domain: "{{ authentik_identity_profiles[authentik_environment].issuer_host }}"
    authentik_server_alias: "authentik-server-{{ authentik_environment }}"

- name: Prepare shared ingress without requiring a NetBird deployment
  ansible.builtin.import_role:
    name: shared_ingress

- name: Reconcile the application storage and declared ingress attachments
  ansible.builtin.import_role:
    name: app_compose

- name: Attach application Nginx before publishing the Authentik virtual host
  community.docker.docker_compose_v2:
    project_src: '{{ shared_ingress_compose_directory }}'
    project_name: '{{ shared_ingress_compose_project if shared_ingress_compose_project else omit }}'
    files: '{{ [shared_ingress_compose_file] if shared_ingress_compose_file else omit }}'
    services: [nginx]
    dependencies: false
    state: present
    recreate: auto

- name: Check the environment-specific Authentik certificate
  ansible.builtin.stat:
    path: "{{ app_directory }}/certbot/conf/live/{{ authentik_domain }}/fullchain.pem"
  register: authentik_certificate

- name: Require the controller-issued authentik certificate before private DNS deployment
  ansible.builtin.assert:
    that: authentik_certificate.stat.exists
    fail_msg: Import the environment-bound certificate from the trusted controller first.
  when: (hou1_controller_managed_tls | default(false) | bool or rehearsal_controller_managed_tls | default(false) | bool)

- name: Obtain the Authentik DNS-01 certificate
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ app_directory }}/certbot/conf:/etc/letsencrypt"
      - -v
      - "{{ app_directory }}/certbot/cloudflare.ini:/cloudflare.ini:ro"
      - "{{ authentik_certbot_image }}"
      - certonly
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ letsencrypt_email }}"
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - /cloudflare.ini
      - --dns-cloudflare-propagation-seconds
      - '20'
      - --cert-name
      - "{{ authentik_domain }}"
      - -d
      - "{{ authentik_domain }}"
  when:
    - not authentik_certificate.stat.exists
    - not (hou1_controller_managed_tls | default(false) | bool or rehearsal_controller_managed_tls | default(false) | bool)
  no_log: true

- name: Render the Authentik Nginx virtual host
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ authentik_ingress_directory }}/authentik-{{ authentik_environment }}.conf"
    owner: root
    group: root
    mode: '0644'
  register: authentik_nginx_config

- name: Validate Nginx before reload
  ansible.builtin.command:
    argv: "{{ shared_ingress_compose_argv + ['exec', '-T', 'nginx', 'nginx', '-t'] }}"
  changed_when: false

- name: Reload Nginx after publishing the Authentik virtual host
  ansible.builtin.command:
    argv: "{{ shared_ingress_compose_argv + ['exec', '-T', 'nginx', 'nginx', '-s', 'reload'] }}"
  when: authentik_nginx_config.changed
