---
- name: Derive and validate the isolated Authentik environment
  ansible.builtin.import_tasks: preflight.yml

- name: Prepare Authentik networks and persistent directories
  ansible.builtin.import_tasks: storage.yml

- name: Load private inputs and render Authentik runtime files
  ansible.builtin.import_tasks: secrets.yml

- name: Prepare login presentation and the pinned Compose project
  ansible.builtin.import_tasks: compose.yml

- name: Install Authentik backup and recovery resources
  ansible.builtin.import_tasks: backup.yml

- name: Validate and start the isolated Authentik project
  ansible.builtin.import_tasks: deploy.yml

- name: Publish Authentik through the existing Nginx ingress
  ansible.builtin.import_tasks: ingress.yml

- name: Apply private identity inputs and optional Grafana identity
  ansible.builtin.import_tasks: bootstrap.yml
