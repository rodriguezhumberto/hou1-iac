---
- name: Derive environment-specific project names and roots
  ansible.builtin.set_fact:
    authentik_project_root: "{{ authentik_project_root_base }}/{{ authentik_environment }}"
    authentik_data_root: "{{ authentik_data_root_base }}/{{ authentik_environment }}"
    authentik_compose_project: "{{ authentik_compose_project_prefix }}-{{ authentik_environment }}"
    authentik_ingress_network: "{{ authentik_test_network if authentik_environment == 'test' else authentik_prod_network }}"
    authentik_backup_root: "{{ authentik_backup_root_base }}/{{ authentik_environment }}"
    authentik_offhost_backup_root: "{{ authentik_offhost_backup_root_base }}/{{ authentik_environment }}"

- name: Validate Authentik environment and isolated roots
  ansible.builtin.assert:
    that:
      - authentik_environment in ['test', 'prod']
      - authentik_project_root is match('^/opt/hou1-authentik/(test|prod)$')
      - authentik_data_root is match('^/var/lib/hou1-authentik/(test|prod)$')
      - authentik_compose_project is match('^hou1-authentik-(test|prod)$')
      - authentik_age_key_file is defined
      - authentik_age_key_file is match('^/')
      - authentik_secret_source is defined
    fail_msg: Authentik requires an isolated test/prod root and SOPS-rendered secrets of at least 32 characters.
  no_log: true

- name: Create the dedicated Authentik ingress network
  community.docker.docker_network:
    name: "{{ authentik_ingress_network }}"
    state: present

- name: Create persistent Authentik directories with restrictive ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: '0750'
  loop:
    - {path: "{{ authentik_project_root }}", owner: root, group: root}
    - {path: "{{ authentik_data_root }}", owner: root, group: root}
    - {path: "{{ authentik_data_root }}/postgres", owner: "{{ authentik_postgres_uid }}", group: "{{ authentik_postgres_gid }}"}
    - {path: "{{ authentik_data_root }}/media", owner: "{{ authentik_container_uid }}", group: "{{ authentik_container_gid }}"}
    - {path: "{{ authentik_data_root }}/templates", owner: "{{ authentik_container_uid }}", group: "{{ authentik_container_gid }}"}
    - {path: "{{ authentik_data_root }}/certs", owner: "{{ authentik_container_uid }}", group: "{{ authentik_container_gid }}"}
    - {path: "{{ authentik_data_root }}/config", owner: "{{ authentik_container_uid }}", group: "{{ authentik_container_gid }}"}

- name: Create local and off-host backup roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - "{{ authentik_backup_root }}"
    - "{{ authentik_offhost_backup_root }}"

- name: Decrypt SOPS/age secrets only for deployment and render root-only files
  block:
    - name: Verify the encrypted environment secret exists on the controller
      ansible.builtin.stat:
        path: "{{ authentik_secret_source }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: authentik_secret_source_stat

    - name: Refuse deployment without the environment-specific encrypted secret
      ansible.builtin.assert:
        that: authentik_secret_source_stat.stat.exists
        fail_msg: Encrypt the {{ authentik_environment }} secret set with SOPS/age before deployment.

    - name: Copy ciphertext to a root-only temporary path
      ansible.builtin.copy:
        src: "{{ authentik_secret_source }}"
        dest: "{{ authentik_project_root }}/.secrets.encrypted.yml"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Decrypt ciphertext without exposing plaintext in command output
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --input-type
          - yaml
          - --output-type
          - yaml
          - --output
          - "{{ authentik_project_root }}/.secrets.decrypted.yml"
          - "{{ authentik_project_root }}/.secrets.encrypted.yml"
      environment:
        SOPS_AGE_KEY_FILE: "{{ authentik_age_key_file }}"
      no_log: true

    - name: Restrict decrypted secret ownership and mode before reading
      ansible.builtin.file:
        path: "{{ authentik_project_root }}/.secrets.decrypted.yml"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Read decrypted values from the managed host without logging them
      ansible.builtin.slurp:
        src: "{{ authentik_project_root }}/.secrets.decrypted.yml"
      register: authentik_decrypted_file
      no_log: true

    - name: Load decrypted values into Ansible memory without logging them
      ansible.builtin.set_fact:
        authentik_decrypted: "{{ authentik_decrypted_file.content | b64decode | from_yaml }}"
      no_log: true

    - name: Map environment secrets to deployment inputs
      ansible.builtin.set_fact:
        authentik_secret_key: "{{ authentik_decrypted.AUTHENTIK_SECRET_KEY }}"
        authentik_postgres_password: "{{ authentik_decrypted.AUTHENTIK_POSTGRES_PASSWORD }}"
        authentik_bootstrap_token: "{{ authentik_decrypted.AUTHENTIK_BOOTSTRAP_TOKEN }}"
        staff_oidc_client_secret: "{{ authentik_decrypted.STAFF_OIDC_CLIENT_SECRET }}"
        netbird_oidc_client_secret: "{{ authentik_decrypted.NETBIRD_OIDC_CLIENT_SECRET }}"
      no_log: true

    - name: Validate secret lengths before rendering
      ansible.builtin.assert:
        that:
          - authentik_secret_key | length >= 32
          - authentik_postgres_password | length >= 32
          - staff_oidc_client_secret | length >= 32
          - netbird_oidc_client_secret | length >= 32
        fail_msg: The decrypted secret set is incomplete or contains short values.
      no_log: true

    - name: Render the private Authentik environment file
      ansible.builtin.template:
        src: authentik.env.j2
        dest: "{{ authentik_project_root }}/authentik.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Render the private client-secret overlap file
      ansible.builtin.template:
        src: oidc-clients.env.j2
        dest: "{{ authentik_project_root }}/oidc-clients.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true
  always:
    - name: Remove encrypted and decrypted temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ authentik_project_root }}/.secrets.encrypted.yml"
        - "{{ authentik_project_root }}/.secrets.decrypted.yml"
      no_log: true

- name: Render the pinned isolated Compose project
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ authentik_project_root }}/compose.yaml"
    owner: root
    group: root
    mode: '0644'

- name: Retain environment ciphertext on the host for encrypted backups
  ansible.builtin.copy:
    src: "{{ authentik_secret_source }}"
    dest: "{{ authentik_project_root }}/secrets.enc.yaml"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Install encrypted Authentik backup and restore commands
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ authentik_project_root }}/{{ item.dest }}"
    owner: root
    group: root
    mode: '0700'
  loop:
    - {src: backup.sh.j2, dest: backup.sh}
    - {src: restore.sh.j2, dest: restore.sh}
    - {src: restore-drill.sh.j2, dest: restore-drill.sh}
  no_log: true

- name: Schedule encrypted Authentik backups with failure reporting
  ansible.builtin.cron:
    name: "HOU1 Authentik {{ authentik_environment }} encrypted backup"
    minute: "{{ authentik_backup_schedule_minute }}"
    hour: "{{ authentik_backup_schedule_hour }}"
    job: "{{ authentik_project_root }}/backup.sh >> /var/log/hou1-authentik-backup-{{ authentik_environment }}.log 2>&1"

- name: Validate the Authentik Compose model before startup
  ansible.builtin.command: docker compose -p "{{ authentik_compose_project }}" -f compose.yaml config
  args:
    chdir: "{{ authentik_project_root }}"
  changed_when: false
  no_log: true

- name: Start Authentik only after PostgreSQL health becomes ready
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_project_root }}"
    project_name: "{{ authentik_compose_project }}"
    files: [compose.yaml]
    state: present
    wait: true
    wait_timeout: 900

- name: Inspect the running Authentik project
  ansible.builtin.command: docker compose -p "{{ authentik_compose_project }}" -f compose.yaml ps --format json
  args:
    chdir: "{{ authentik_project_root }}"
  register: authentik_compose_ps
  changed_when: false

- name: Require healthy Authentik services and no public database ports
  ansible.builtin.assert:
    that:
      - authentik_compose_ps.stdout is search('postgresql')
      - authentik_compose_ps.stdout is search('authentik-server')
      - authentik_compose_ps.stdout is search('authentik-worker')
      - authentik_compose_ps.stdout is not search('0\.0\.0\.0:5432|:::5432')
    fail_msg: Authentik Compose did not start healthy or PostgreSQL has a public listener.

- name: Derive the environment-specific public Authentik hostname
  ansible.builtin.set_fact:
    authentik_domain: "{{ 'auth-test.' ~ primary_domain if authentik_environment == 'test' else 'auth.' ~ primary_domain }}"
    authentik_server_alias: "authentik-server-{{ authentik_environment }}"

- name: Require the existing Nginx ingress mount before publishing Authentik
  ansible.builtin.stat:
    path: "{{ netbird_control_plane_directory }}/nginx-include.conf"
  register: authentik_ingress_include

- name: Refuse to publish an ingress that Nginx cannot load
  ansible.builtin.assert:
    that: authentik_ingress_include.stat.exists
    fail_msg: Deploy the existing Nginx/NetBird ingress integration before Authentik DNS and TLS.

- name: Check the environment-specific Authentik certificate
  ansible.builtin.stat:
    path: "{{ app_directory }}/certbot/conf/live/{{ authentik_domain }}/fullchain.pem"
  register: authentik_certificate

- name: Obtain the Authentik DNS-01 certificate
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ app_directory }}/certbot/conf:/etc/letsencrypt"
      - -v
      - "{{ app_directory }}/certbot/cloudflare.ini:/cloudflare.ini:ro"
      - "{{ authentik_certbot_image }}"
      - certonly
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ letsencrypt_email }}"
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - /cloudflare.ini
      - --dns-cloudflare-propagation-seconds
      - '20'
      - --cert-name
      - "{{ authentik_domain }}"
      - -d
      - "{{ authentik_domain }}"
  when: not authentik_certificate.stat.exists
  no_log: true

- name: Render the Authentik Nginx virtual host
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ authentik_ingress_directory }}/authentik-{{ authentik_environment }}.conf"
    owner: root
    group: root
    mode: '0644'
  register: authentik_nginx_config

- name: Validate Nginx before reload
  ansible.builtin.command: docker compose exec -T nginx nginx -t
  args:
    chdir: "{{ app_directory }}"
  changed_when: false

- name: Reload Nginx after publishing the Authentik virtual host
  ansible.builtin.command: docker compose exec -T nginx nginx -s reload
  args:
    chdir: "{{ app_directory }}"
  when: authentik_nginx_config.changed

- name: Install the idempotent Authentik identity bootstrap utility
  ansible.builtin.copy:
    src: bootstrap.py
    dest: "{{ authentik_project_root }}/bootstrap.py"
    owner: root
    group: root
    mode: '0700'
  when: authentik_bootstrap_enabled | bool

- name: Locate the healthy Authentik container for private bootstrap
  ansible.builtin.command:
    argv: [docker, compose, -p, "{{ authentik_compose_project }}", -f, compose.yaml, ps, -q, authentik-server]
    chdir: "{{ authentik_project_root }}"
  register: authentik_bootstrap_container_id
  changed_when: false
  when: authentik_bootstrap_enabled | bool

- name: Inspect Authentik's private ingress address
  community.docker.docker_container_info:
    name: "{{ authentik_bootstrap_container_id.stdout }}"
  register: authentik_bootstrap_container
  when: authentik_bootstrap_enabled | bool

- name: Select the host-local private API without opening management ingress
  ansible.builtin.set_fact:
    authentik_bootstrap_base_url: "{{ authentik_api_url | default('http://' ~ authentik_bootstrap_container.container.NetworkSettings.Networks[authentik_ingress_network].IPAddress ~ ':9000') }}"
  when: authentik_bootstrap_enabled | bool

- name: Render the isolated environment identity manifest
  ansible.builtin.template:
    src: "bootstrap-{{ authentik_environment }}.json.j2"
    dest: "{{ authentik_project_root }}/bootstrap.json"
    owner: root
    group: root
    mode: '0600'
  when: authentik_bootstrap_enabled | bool

- name: Apply Authentik groups, claims, scopes, users, and clients idempotently
  ansible.builtin.command:
    argv:
      - python3
      - "{{ authentik_project_root }}/bootstrap.py"
      - --base-url
      - "{{ authentik_bootstrap_base_url }}"
      - --environment
      - "{{ authentik_environment }}"
      - --manifest
      - "{{ authentik_project_root }}/bootstrap.json"
  environment:
    AUTHENTIK_BOOTSTRAP_TOKEN: "{{ authentik_bootstrap_token }}"
    STAFF_OIDC_CLIENT_SECRET: "{{ staff_oidc_client_secret }}"
    NETBIRD_OIDC_CLIENT_SECRET: "{{ netbird_oidc_client_secret }}"
  register: authentik_bootstrap_result
  changed_when: true
  when: authentik_bootstrap_enabled | bool
  no_log: true
