---
- name: Install the idempotent Authentik identity bootstrap utility
  ansible.builtin.copy:
    src: bootstrap.py
    dest: "{{ authentik_project_root }}/bootstrap.py"
    owner: root
    group: root
    mode: '0700'
  when: authentik_bootstrap_enabled | bool

- name: Locate the healthy Authentik container for private bootstrap
  ansible.builtin.command:
    argv: [docker, compose, -p, "{{ authentik_compose_project }}", -f, compose.yaml, ps, -q, authentik-server]
    chdir: "{{ authentik_project_root }}"
  register: authentik_bootstrap_container_id
  changed_when: false
  when: authentik_bootstrap_enabled | bool

- name: Inspect Authentik's private ingress address
  community.docker.docker_container_info:
    name: "{{ authentik_bootstrap_container_id.stdout }}"
  register: authentik_bootstrap_container
  when: authentik_bootstrap_enabled | bool

- name: Select the host-local private API without opening management ingress
  ansible.builtin.set_fact:
    authentik_bootstrap_base_url: "{{ authentik_api_url | default('http://' ~ authentik_bootstrap_container.container.NetworkSettings.Networks[authentik_ingress_network].IPAddress ~ ':9000') }}"
  when: authentik_bootstrap_enabled | bool

- name: Render the public inventory identity profile for independent validation
  ansible.builtin.copy:
    content: "{{ authentik_identity_profiles[authentik_environment] | to_nice_json }}\n"
    dest: "{{ authentik_project_root }}/identity-profile.json"
    owner: root
    group: root
    mode: '0600'
  when: authentik_bootstrap_enabled | bool

- name: Render the isolated environment identity manifest
  ansible.builtin.template:
    src: bootstrap.json.j2
    dest: "{{ authentik_project_root }}/bootstrap.json"
    owner: root
    group: root
    mode: '0600'
  when: authentik_bootstrap_enabled | bool
  no_log: true

- name: Apply private Authentik identity inputs and remove the runtime manifest
  when: authentik_bootstrap_enabled | bool
  no_log: true
  block:
    - name: Apply Authentik groups, claims, scopes, users, and clients idempotently
      ansible.builtin.command:
        argv:
          - python3
          - "{{ authentik_project_root }}/bootstrap.py"
          - --base-url
          - "{{ authentik_bootstrap_base_url }}"
          - --environment
          - "{{ authentik_environment }}"
          - --profile
          - "{{ authentik_project_root }}/identity-profile.json"
          - --manifest
          - "{{ authentik_project_root }}/bootstrap.json"
      environment:
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ authentik_bootstrap_token }}"
        STAFF_OIDC_CLIENT_SECRET: "{{ staff_oidc_client_secret }}"
        NETBIRD_OIDC_CLIENT_SECRET: "{{ netbird_oidc_client_secret }}"
        GOOGLE_OAUTH_CLIENT_SECRET: "{{ authentik_decrypted.GOOGLE_OAUTH_CLIENT_SECRET | default('') }}"
        AUTHENTIK_IDENTITY_NAMES: "{{ authentik_decrypted.IDENTITY_NAMES | to_json }}"
      register: authentik_bootstrap_result
      changed_when: true
  always:
    - name: Remove plaintext identity input after a successful or failed bootstrap
      ansible.builtin.file:
        path: "{{ authentik_project_root }}/bootstrap.json"
        state: absent

- name: Configure optional Grafana identity after the shared platform is ready
  ansible.builtin.include_role:
    name: grafana_identity
  when:
    - grafana_identity_enabled | default(false) | bool
    - not (node_bootstrap | default(true) | bool)
