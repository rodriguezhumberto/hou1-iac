---
- name: Load secrets on the controller and render root-only runtime files
  block:
    - name: Load the environment secrets on the controller
      community.sops.load_vars:
        file: "{{ authentik_secret_source }}"
        name: authentik_decrypted
        age_keyfile: "{{ authentik_controller_age_key_file | default(omit) }}"
      no_log: true

    - name: Load the encrypted organization naming contract for identity bootstrap
      when: authentik_bootstrap_enabled | bool
      no_log: true
      block:
        - name: Copy the owner-encrypted naming bundle for deployment and recovery
          ansible.builtin.copy:
            src: "{{ authentik_identity_secret_source }}"
            dest: "{{ authentik_project_root }}/identity-names.enc.json"
            owner: root
            group: root
            mode: '0600'

        - name: Decrypt identity names into memory only
          community.sops.load_vars:
            file: "{{ authentik_identity_secret_source }}"
            name: authentik_private_identity_names
            age_keyfile: "{{ authentik_controller_age_key_file | default(omit) }}"

        - name: Merge the private naming contract into bootstrap inputs
          ansible.builtin.set_fact:
            authentik_decrypted: "{{ authentik_decrypted | combine(authentik_private_identity_names) }}"

        - name: Require the naming bundle to match the selected environment
          ansible.builtin.assert:
            that: authentik_decrypted.IDENTITY_NAMES.environment == authentik_environment

    - name: Map environment secrets to deployment inputs
      ansible.builtin.set_fact:
        authentik_secret_key: "{{ authentik_decrypted.AUTHENTIK_SECRET_KEY }}"
        authentik_postgres_password: "{{ authentik_decrypted.AUTHENTIK_POSTGRES_PASSWORD }}"
        authentik_bootstrap_token: "{{ authentik_decrypted.AUTHENTIK_BOOTSTRAP_TOKEN }}"
        staff_oidc_client_secret: "{{ authentik_decrypted.STAFF_OIDC_CLIENT_SECRET }}"
        netbird_oidc_client_secret: "{{ authentik_decrypted.NETBIRD_OIDC_CLIENT_SECRET }}"
      no_log: true

    - name: Validate secret lengths before rendering
      ansible.builtin.assert:
        that:
          - authentik_secret_key | length >= 32
          - authentik_postgres_password | length >= 32
          - staff_oidc_client_secret | length >= 32
          - netbird_oidc_client_secret | length >= 32
          - not (authentik_bootstrap_enabled | bool) or authentik_decrypted.IDENTITY_NAMES is defined
          - not (authentik_bootstrap_enabled | bool) or authentik_decrypted.IDENTITY_NAMES.environment == authentik_environment
        fail_msg: The decrypted secret set is incomplete or contains short values.
      no_log: true

    - name: Render the private Authentik environment file
      ansible.builtin.template:
        src: authentik.env.j2
        dest: "{{ authentik_project_root }}/authentik.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Render the private client-secret overlap file
      ansible.builtin.template:
        src: oidc-clients.env.j2
        dest: "{{ authentik_project_root }}/oidc-clients.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true
  always:
    - name: Remove temporary files from earlier deployments
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ authentik_project_root }}/.secrets.encrypted.yml"
        - "{{ authentik_project_root }}/.secrets.decrypted.yml"
      no_log: true
