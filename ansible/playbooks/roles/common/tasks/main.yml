---
- name: Ensure resolv.conf is unlocked before modifying
  file:
    path: /etc/resolv.conf
    attributes: -i
  ignore_errors: yes 

- name: Create the systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Persist resolver fallbacks for hosts without provider DNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/99-hou1-fallback-dns.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Resolve]
      FallbackDNS=1.1.1.1 9.9.9.9
  register: hou1_resolver_fallback

- name: Reload systemd-resolved after configuring resolver fallbacks
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when: hou1_resolver_fallback.changed

- name: Update and upgrade apt packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install required system packages
  apt:
    name:
      - ufw
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - git
      - cron
      - python3-docker
      - sqlite3
      - mtr-tiny
    state: present

- name: Create the new non-root user
  user:
    name: "{{ new_user }}"
    shell: /bin/bash
    groups: sudo
    append: yes
    create_home: yes

- name: Set up authorized SSH keys for the new user
  authorized_key:
    user: "{{ new_user }}"
    state: present
    key: "{{ new_user_public_key }}"

- name: Allow passwordless sudo for the new user
  copy:
    dest: "/etc/sudoers.d/{{ new_user }}"
    content: "{{ new_user }} ALL=(ALL) NOPASSWD: ALL"
    mode: '0440'
    validate: /usr/sbin/visudo -csf %s
