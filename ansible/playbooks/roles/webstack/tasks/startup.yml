---
- name: Install retryable application startup after VPN address readiness
  ansible.builtin.template:
    src: hou1-webstack.service.j2
    dest: /etc/systemd/system/hou1-webstack.service
    owner: root
    group: root
    mode: '0644'
  register: webstack_startup_unit

- name: Enable application recovery on subsequent boots
  ansible.builtin.systemd_service:
    name: hou1-webstack
    daemon_reload: '{{ webstack_startup_unit.changed }}'
    enabled: true
  # Deployment already activated and verified this project. Do not run it twice
  # or stop shared ingress when this oneshot unit is stopped.
