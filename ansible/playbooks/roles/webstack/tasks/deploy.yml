---
- name: Prepare shared ingress before starting the application
  ansible.builtin.import_role:
    name: shared_ingress

- name: Validate Compose configuration before deployment
  ansible.builtin.command: docker compose config --format json
  args:
    chdir: "{{ app_directory }}"
  register: cms_compose_config
  changed_when: false
  no_log: true

- name: Refuse unexpected build definitions in the rendered deployment
  ansible.builtin.assert:
    that:
      - (cms_compose_config.stdout | from_json).services.values() | selectattr('build', 'defined') | list | length == 0
      - (cms_compose_config.stdout | from_json).services['astro-app'].image == application_image_reference
    fail_msg: Deployment requires the verified digest and no host-side builds.

- name: Freeze and archive this project's retired Directus service
  ansible.builtin.import_tasks: retire-directus.yml

- name: Install retryable Compose activation
  ansible.builtin.import_role:
    name: compose_runtime

- name: Deploy the verified application without building on the host
  # Public bootstrap needs Nginx and its dependencies before NetBird exists.
  # Defer services that bind the NetBird IP until enrollment completes.
  ansible.builtin.command: >-
    /usr/local/libexec/hou1-compose-apply {{ app_directory | quote }} --validate-nginx
    {{ '--services nginx' if webstack_bootstrap_ingress_only | default(false) | bool else '' }}
  register: webstack_activation
  changed_when: (webstack_activation.stdout | from_json).changed

- name: Verify controller certificates after repairing application services
  ansible.builtin.include_role:
    name: controller_tls
    tasks_from: verify
    apply:
      tags: [deploy, webstack, ssl]
  when:
    - hou1_controller_managed_tls | default(false) | bool
    - not (webstack_bootstrap_ingress_only | default(false) | bool)

- name: Record the deployed artifact for encrypted backups and recovery
  ansible.builtin.copy:
    dest: '{{ app_directory }}/application-image.json'
    owner: root
    group: root
    mode: '0644'
    content: '{{ application_image_verified | to_nice_json }}'

- name: Configure boot recovery only after full application activation
  ansible.builtin.include_tasks: startup.yml
  when: not (webstack_bootstrap_ingress_only | default(false) | bool)

- name: Remove archived Directus containers from this project
  ansible.builtin.command:
    argv: [docker, rm, "{{ item }}"]
  loop: "{{ retired_directus_containers.stdout_lines }}"
