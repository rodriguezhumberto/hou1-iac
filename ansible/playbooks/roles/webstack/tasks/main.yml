---
- name: Verify and configure the selected application
  ansible.builtin.import_tasks: application.yml

- name: Prepare CMS storage and recovery commands
  ansible.builtin.import_tasks: storage.yml

- name: Preserve or render the application runtime environment
  ansible.builtin.import_tasks: runtime.yml

- name: Prepare application TLS certificates and renewal
  ansible.builtin.import_tasks: tls.yml

- name: Validate and deploy the verified application
  ansible.builtin.import_tasks: deploy.yml
