---
- name: Pull from GitHub
  git:
    repo: "{{ app_repo_pat }}"
    dest: "{{ app_directory }}"
    version: "{{ deploy_ref | default(deploy_branch | default('main')) }}"
    update: yes
    force: yes
  no_log: true

# The application template currently has one legacy VPN allow directive. Manage
# the CIDRs here after every checkout so deployment cannot restore the old ACL.
- name: Configure CMS access for enabled VPNs
  ansible.builtin.import_tasks: cms-acl.yml

- name: Validate CMS environment and the existing database mount
  ansible.builtin.assert:
    that:
      - cms_environment in ['test', 'production']
      - cms_pets_source in ['directus', 'cms']
      - cms_database_directory == (app_directory ~ '/database')
      - directus_database_directory == cms_database_directory
    fail_msg: Keep the existing database mount during rollout; select test/production and a supported pet source.

# Both deployment paths preserve the other's portion of the managed override.
# Application runs do not deploy or configure the control-plane service itself.
- name: Ensure legacy Directus database directory exists
  file:
    path: "{{ directus_database_directory }}"
    state: directory
    owner: "1000"
    group: "{{ cms_storage_group }}"
    mode: '0770'

- name: Ensure Directus directories exist with correct permissions
  file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'
  loop:
    - "{{ directus_extensions_directory }}"
    - "{{ directus_uploads_directory }}"

- name: Ensure replacement CMS storage directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cms_storage_owner }}"
    group: "{{ cms_storage_group }}"
    mode: "{{ cms_storage_mode }}"
  loop:
    - "{{ cms_data_directory }}"
    - "{{ cms_media_directory }}"

- name: Find existing Astro database and WAL files without moving them
  ansible.builtin.find:
    paths: "{{ cms_database_directory }}"
    patterns: ['forms.db', 'forms.db-wal', 'forms.db-shm']
    file_type: file
  register: cms_existing_database

- name: Keep the existing Astro database writable by the application
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ cms_storage_owner }}"
    group: "{{ cms_storage_group }}"
    mode: '0640'
  loop: "{{ cms_existing_database.files }}"

- name: Preserve ingress while configuring the media mount
  ansible.builtin.import_tasks: cms-compose.yml

- name: Ensure CMS backup directory exists
  ansible.builtin.file:
    path: "{{ cms_backup_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install CMS backup script
  ansible.builtin.template:
    src: cms-backup.sh.j2
    dest: "{{ app_directory }}/cms-backup.sh"
    owner: root
    group: root
    mode: '0700'

- name: Install CMS restore and validation script
  ansible.builtin.template:
    src: cms-restore.sh.j2
    dest: "{{ app_directory }}/cms-restore.sh"
    owner: root
    group: root
    mode: '0700'

- name: Schedule CMS database and media backups
  ansible.builtin.cron:
    name: "Pearland Paws {{ cms_environment }} CMS backup"
    minute: "{{ cms_backup_schedule_minute }}"
    hour: "{{ cms_backup_schedule_hour }}"
    job: "{{ app_directory }}/cms-backup.sh >> /var/log/pearlandpaws-cms-backup.log 2>&1"

- name: Seed only Directus (never seed customer form submissions)
  copy:
    src: "{{ seed_db_source_path }}/directus.db"
    dest: "{{ directus_database_directory }}/directus.db"
    owner: "1000"
    group: "1000"
    mode: '0660'
    force: no

- name: Seed initial Directus image uploads (will NOT overwrite existing production media)
  copy:
    src: "{{ seed_uploads_source_path }}/" 
    dest: "{{ directus_uploads_directory }}/"
    owner: "1000"
    group: "1000"
    mode: '0644'
    directory_mode: '0755'
    force: no

- name: Seed initial replacement CMS media (will NOT overwrite existing production media)
  copy:
    src: "{{ seed_cms_media_source_path }}/"
    dest: "{{ cms_media_directory }}/"
    owner: "{{ cms_storage_owner }}"
    group: "{{ cms_storage_group }}"
    mode: '0644'
    directory_mode: "{{ cms_storage_mode }}"
    force: no
  when: seed_cms_media_source_path is defined

- name: Inject production .env file for Astro
  copy:
    dest: "{{ app_directory }}/.env"
    mode: '0600'
    content: |
      # Network Setup
      HOU1_VPN_IP={{ management_ip }}
      vpn_subnet={{ vpn_subnet }}
      staff_vpn_subnet={{ staff_vpn_subnet }}

      # Directus Environment Variables
      DIRECTUS_LICENSE_KEY={{ DIRECTUS_LICENSE_KEY }}
      DIRECTUS_KEY={{ DIRECTUS_KEY }}
      DIRECTUS_SECRET={{ DIRECTUS_SECRET }}
      DIRECTUS_ADMIN_EMAIL={{ DIRECTUS_ADMIN_EMAIL }}
      DIRECTUS_ADMIN_PASSWORD={{ DIRECTUS_ADMIN_PASSWORD }}
      DIRECTUS_PUBLIC_URL={{ DIRECTUS_PUBLIC_URL }}
      DIRECTUS_TOKEN={{ DIRECTUS_TOKEN }}
      
      # Nginx Environment Mappings
      PRIMARY_CERT_DIR={{ ssl_domains | selectattr('name', 'search', primary_domain) | map(attribute='name') | first | default('test.' ~ primary_domain) }}
      SECONDARY_CERT_DIR={{ ssl_domains | selectattr('name', 'search', secondary_domain) | map(attribute='name') | first | default('test.' ~ primary_domain) }}
      STAFF_HOSTNAME={{ staff_domain }}
      STAFF_CERT_DIR={{ staff_cert_dir }}
      PUBLIC_SITE_ORIGIN={{ public_site_origin }}

      # for hCaptcha
      PUBLIC_HCAPTCHA_SITE_KEY={{ public_hcaptcha_site_key }}
      HCAPTCHA_SECRET_KEY={{ hcaptcha_secret_key }}

      # Web Push
      PUBLIC_VAPID_PUBLIC_KEY={{ VAPID_PUBLIC_KEY }}
      VAPID_PUBLIC_KEY={{ VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY={{ VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT={{ VAPID_SUBJECT }}

      # Staff app authentication
      STAFF_PASSWORD={{ STAFF_PASSWORD }}
      STAFF_SESSION_SECRET={{ STAFF_SESSION_SECRET }}

      # Replacement CMS storage (test and production are host-isolated)
      CMS_ENVIRONMENT={{ cms_environment }}
      CMS_DATABASE_DIR=/var/data
      CMS_MEDIA_DIR=/var/data/media
      CMS_UPLOAD_MAX_BYTES={{ cms_upload_max_bytes }}
      CMS_PETS_SOURCE={{ cms_pets_source }}

- name: Deploy Cloudflare API Credentials File
  copy:
    dest: "{{ app_directory }}/certbot/cloudflare.ini"
    mode: '0600'
    content: |
      dns_cloudflare_api_token = {{ cloudflare_dns_api_token }}
  no_log: true

- name: Obtain or update SSL certificates via Cloudflare DNS-01
  command: >
    docker run --rm
    -v {{ app_directory }}/certbot/conf:/etc/letsencrypt 
    -v {{ app_directory }}/certbot/cloudflare.ini:/cloudflare.ini:ro
    certbot/dns-cloudflare certonly 
    -a dns-cloudflare
    -m {{ letsencrypt_email }} 
    {{ item.flags }}
    --expand
    --keep-until-expiring
    --dns-cloudflare-credentials /cloudflare.ini
    --dns-cloudflare-propagation-seconds 20
  loop: "{{ ssl_domains | default([]) }}"
  loop_control:
    label: "Hidden Domain"

- name: Create automated SSL renewal script
  copy:
    dest: "{{ app_directory }}/certbot/renew_ssl.sh"
    mode: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      
      docker run --rm \
        -v {{ app_directory }}/certbot/conf:/etc/letsencrypt \
        -v {{ app_directory }}/certbot/cloudflare.ini:/cloudflare.ini:ro \
        certbot/dns-cloudflare renew

      cd "{{ app_directory }}"
      docker compose exec -T nginx nginx -t
      docker compose exec -T nginx nginx -s reload

- name: Schedule cron job for SSL renewal
  cron:
    name: "Renew Let's Encrypt SSL Certificates"
    minute: "0"
    hour: "2"
    day: "1,15"
    job: "{{ app_directory }}/certbot/renew_ssl.sh >> /var/log/certbot-cron.log 2>&1"
  
- name: Validate Compose configuration before deployment
  ansible.builtin.command: docker compose config --quiet
  args:
    chdir: "{{ app_directory }}"
  changed_when: false

- name: Detect whether the transitional Directus service is present
  ansible.builtin.command: docker compose config --services
  args:
    chdir: "{{ app_directory }}"
  register: compose_services
  changed_when: false

- name: Rebuild and deploy updated Docker containers
  command: docker compose up -d --build
  args:
    chdir: "{{ app_directory }}"

- name: Configure Directus while the transitional ingress remains enabled
  ansible.builtin.include_role:
    name: directus_config
  when:
    - directus_enabled | default(true) | bool
    - "'directus' in compose_services.stdout_lines"

# Nginx's entrypoint renders bind-mounted templates only at container startup.
# Recreate it so changed CMS ACLs and atomic Git checkouts are actually applied.
- name: Recreate Nginx to render the current ingress templates
  ansible.builtin.command: docker compose up -d --no-deps --force-recreate nginx
  args:
    chdir: "{{ app_directory }}"

- name: Validate the deployed Nginx configuration
  ansible.builtin.command: docker compose exec -T nginx nginx -t
  args:
    chdir: "{{ app_directory }}"
  changed_when: false
