---
- name: Validate scheduled admission transport and coordination
  ansible.builtin.assert:
    that:
      - identity_admission_coordination_lock is match('^/[A-Za-z0-9_./-]+$')
      - identity_admission_python is match('^/[A-Za-z0-9_./-]+$')
      - identity_admission_transport_argv is sequence
      - identity_admission_transport_argv is not string
      - identity_admission_transport_argv | select('string') | list | length == identity_admission_transport_argv | length
      - identity_admission_transport_argv | reject('match', '^[-A-Za-z0-9_./]+$') | list | length == 0
  when: identity_admission_schedule_enabled

- name: Read controller user-manager persistence
  ansible.builtin.command:
    argv: [loginctl, show-user, '{{ lookup("env", "USER") }}', --property=Linger, --value]
  register: identity_admission_linger
  changed_when: false
  when: identity_admission_schedule_enabled

- name: Require persistent controller scheduling before enabling admission jobs
  ansible.builtin.assert:
    that: identity_admission_linger.stdout == 'yes'
    fail_msg: Enable lingering for the controller user before configuring unattended admission.
  when: identity_admission_schedule_enabled
