---
directus_config_backup_directory: /var/backups/pearlandpaws/directus
directus_database_file: "{{ directus_database_directory | default(app_directory ~ '/database') }}/directus.db"
directus_config_settings:
  storage_asset_transform: all
  asset_presets:
    - key: web-optimized
      fit: contain
      quality: 85
      withoutEnlargement: false
      format: webp
      transforms: []
  public_read_collections: [services, pets, directus_files]
