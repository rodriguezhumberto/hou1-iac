---
- name: Wait for Directus to serve requests
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - directus
      - node
      - -e
      - "fetch('http://localhost:8055/server/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
  args:
    chdir: "{{ app_directory }}"
  register: directus_config_ping
  until: directus_config_ping.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  when: not ansible_check_mode
