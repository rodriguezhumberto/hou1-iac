---
- name: Wait for Directus startup
  ansible.builtin.import_tasks: ready.yml

- name: Reconcile Directus settings
  ansible.builtin.script:
    cmd: >-
      configure.py
      --database {{ directus_database_file | quote }}
      --backup-directory {{ directus_config_backup_directory | quote }}
      --configuration {{ directus_config_settings | to_json | quote }}
      {{ '--check' if ansible_check_mode else '--apply' }}
    executable: "{{ ansible_python_interpreter }}"
  register: directus_config_result
  changed_when: directus_config_result.rc == 0 and (directus_config_result.stdout | from_json).changed
  # The script handles --check without writing.
  check_mode: false

- name: Report settings and backup
  ansible.builtin.debug:
    msg: "{{ directus_config_result.stdout | from_json }}"

- name: Restart Directus to refresh caches
  ansible.builtin.command: docker compose restart directus
  args:
    chdir: "{{ app_directory }}"
  when:
    - not ansible_check_mode
    - directus_config_result is changed

- name: Wait for Directus restart
  ansible.builtin.import_tasks: ready.yml
  when: directus_config_result is changed
