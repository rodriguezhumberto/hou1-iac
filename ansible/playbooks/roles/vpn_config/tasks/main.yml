---
# Included with the always tag so targeted runs cannot bypass migration guards.
- name: Validate VPN rollout stage
  ansible.builtin.assert:
    that:
      - management_vpn in ['wireguard', 'netbird']
      - wireguard_enabled | bool or netbird_enabled | bool
      - management_vpn != 'wireguard' or wireguard_enabled | bool
      - management_vpn != 'netbird' or netbird_enabled | bool
      - wireguard_enabled | bool or management_vpn == 'netbird'
      - wireguard_enabled | bool or ansible_host != hou1_vpn_ip
    fail_msg: >-
      Select an enabled management VPN. Retire WireGuard only after switching
      inventory to NetBird and verifying fresh SSH, CMS and reboot recovery.

- name: Validate self-hosted NetBird configuration
  ansible.builtin.assert:
    that:
      - netbird_management_url is match('^https://[^/]+/?$')
      - (netbird_management_url | urlsplit('hostname')) not in ['api.netbird.io', 'app.netbird.io']
      - netbird_subnet is ansible.utils.ipv4
      - "'/' in netbird_subnet"
      - netbird_subnet | ansible.utils.ipaddr('prefix') | int >= 16
      - netbird_interface is match('^[a-zA-Z0-9_-]{1,15}$')
      - netbird_wireguard_port | int > 0
      - netbird_wireguard_port | int <= 65535
      - netbird_wireguard_port | int != 51820
    fail_msg: Set the self-hosted HTTPS URL, actual account IPv4 CIDR and a port other than 51820.
  when: netbird_enabled | bool

- name: Validate the NetBird management address before inventory cutover
  ansible.builtin.assert:
    that:
      - netbird_ip is ansible.utils.ipv4
      - "'/' not in netbird_ip"
      - netbird_ip is ansible.utils.in_network(netbird_subnet)
    fail_msg: Set netbird_ip to this server's enrolled NetBird address before selecting it as primary.
  when: management_vpn == 'netbird'

- name: Validate the colocated control plane for targeted runs too
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../netbird_control_plane/tasks/validate.yml"
    apply:
      tags: [always]
  when: netbird_control_plane_enabled | bool
