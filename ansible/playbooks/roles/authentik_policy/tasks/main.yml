---
- name: Validate capacity before applying the host policy
  ansible.builtin.import_tasks: capacity.yml

- name: Set UFW default policies before adding the narrow allow list
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}

- name: Allow only public web ingress
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['80', '443']

- name: Allow private administration through NetBird only
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ netbird_interface }}"
    src: "{{ netbird_subnet }}"
    port: '22'
    proto: tcp

- name: Explicitly deny PostgreSQL on public interfaces
  community.general.ufw:
    rule: deny
    direction: in
    port: '5432'
    proto: tcp

- name: Enable the host firewall after policy validation
  community.general.ufw:
    state: enabled

- name: Inspect Docker networks used by the colocated services
  ansible.builtin.command: docker network ls --format json
  register: authentik_docker_networks
  changed_when: false

- name: Require distinct private network names for each trust boundary
  ansible.builtin.assert:
    that:
      - authentik_test_network != authentik_prod_network
      - authentik_test_network != netbird_ingress_network
      - authentik_prod_network != netbird_ingress_network
    fail_msg: Authentik networks must be distinct from each other and from NetBird ingress.

- name: Inspect any running containers for publicly published PostgreSQL ports
  ansible.builtin.command: docker ps --format json
  register: authentik_running_ports
  changed_when: false

- name: Refuse a public PostgreSQL listener
  ansible.builtin.assert:
    that:
      - authentik_running_ports.stdout is not search('0\.0\.0\.0:5432|:::5432')
    fail_msg: A PostgreSQL container is publishing port 5432 on a public interface.
