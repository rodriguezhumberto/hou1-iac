---
- name: Verify the management server and actual listening port
  ansible.builtin.assert:
    that:
      - >-
        ((netbird_after.stdout | from_json).management.url | netbird_endpoint) ==
        (netbird_management_url | netbird_endpoint)
      - (netbird_after.stdout | from_json).wireguardPort | int == netbird_listen_port | int
