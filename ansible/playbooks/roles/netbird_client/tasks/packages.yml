---
- name: Install NetBird repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Download the NetBird repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /usr/share/keyrings/netbird.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure the signed NetBird APT repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/netbird.asc] https://pkgs.netbird.io/debian stable main
    filename: netbird
    state: present

- name: Keep unattended system upgrades on the tested NetBird release
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/netbird
    owner: root
    group: root
    mode: '0644'
    content: |
      Package: netbird
      Pin: version {{ netbird_version }}
      Pin-Priority: 1001

- name: Install the NetBird CLI
  ansible.builtin.apt:
    name: "netbird={{ netbird_version }}"
    state: present
    update_cache: true

