---
- name: Prepare controller-side server enrollment
  block:
    - name: Load the API token from the controller Vault
      netbird_token_vault:
        path: "{{ netbird_token_vault_file }}"
        management_url: "{{ netbird_management_url }}"
        vault_id: "{{ netbird_token_vault_id }}"
      register: netbird_client_token

    - name: Require the saved control-plane token and a server group
      ansible.builtin.assert:
        that:
          - netbird_client_token.exists
          - netbird_server_group in ['test-servers', 'prod-servers']

    - name: Set the authenticated public API context
      ansible.builtin.set_fact:
        netbird_api_url: "{{ netbird_management_url | regex_replace('/$', '') }}"
        netbird_api_headers:
          Authorization: "Token {{ netbird_client_token.token }}"

    - name: Read groups from the public HTTPS management API
      ansible.builtin.uri:
        url: "{{ netbird_api_url }}/api/groups"
        headers: "{{ netbird_api_headers }}"
        status_code: 200
      register: netbird_client_groups

    - name: Require exactly one matching environment group
      ansible.builtin.assert:
        that:
          - netbird_client_groups.json | selectattr('name', 'equalto', netbird_server_group) | list | length == 1

    - name: Select the server group ID
      ansible.builtin.set_fact:
        netbird_server_group_id: >-
          {{ (netbird_client_groups.json | selectattr('name', 'equalto', netbird_server_group) | first).id }}
  delegate_to: localhost
  become: false
  no_log: true
  rescue:
    - name: Explain enrollment prerequisites
      ansible.builtin.fail:
        msg: >-
          Could not prepare server enrollment. Run the control-plane playbook first
          and retain its controller token Vault. Check the Vault password, API
          connectivity/token validity, and the test-servers or prod-servers group.
