---
- name: Require a real run for enrollment and address verification
  ansible.builtin.assert:
    that: not ansible_check_mode
    fail_msg: NetBird enrollment cannot run in check mode. Use syntax-check and the offline validation suite instead.

- name: Validate the declared server address before enrollment
  ansible.builtin.import_tasks: validate-address.yml

- name: Prepare controller API access and the environment group
  ansible.builtin.import_tasks: api-context.yml

- name: Install NetBird repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Download the NetBird repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /usr/share/keyrings/netbird.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure the signed NetBird APT repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/netbird.asc] https://pkgs.netbird.io/debian stable main
    filename: netbird
    state: present

- name: Keep unattended system upgrades on the tested NetBird release
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/netbird
    owner: root
    group: root
    mode: '0644'
    content: |
      Package: netbird
      Pin: version {{ netbird_version }}
      Pin-Priority: 1001

- name: Install the NetBird CLI
  ansible.builtin.apt:
    name: "netbird={{ netbird_version }}"
    state: present
    update_cache: true

- name: Enable and start NetBird
  ansible.builtin.systemd:
    name: netbird
    enabled: true
    state: started

- name: Read NetBird enrollment status
  ansible.builtin.command: netbird status --json
  register: netbird_before
  changed_when: false
  check_mode: false

- name: Decode NetBird status
  ansible.builtin.set_fact:
    netbird_before_status: "{{ netbird_before.stdout | from_json }}"

- name: Check for a previously verified enrollment
  ansible.builtin.stat:
    path: "{{ netbird_enrollment_marker }}"
  register: netbird_marker_stat

- name: Read the enrollment record
  ansible.builtin.slurp:
    src: "{{ netbird_enrollment_marker }}"
  register: netbird_marker
  when: netbird_marker_stat.stat.exists

- name: Check existing enrollment and required credentials
  ansible.builtin.import_tasks: enrollment-check.yml

- name: Configure and connect the persistent peer
  ansible.builtin.import_tasks: connect.yml

- name: Wait for the enrolled peer to connect
  ansible.builtin.command: netbird status --json
  register: netbird_after
  changed_when: false
  until: (netbird_after.stdout | from_json).management.connected | default(false)
  retries: 12
  delay: 5

- name: Verify the connected management server and port
  ansible.builtin.import_tasks: verify-connection.yml

- name: Assign and verify the enrolled server group
  ansible.builtin.import_tasks: membership.yml

- name: Enforce the declared address on the enrolled peer
  ansible.builtin.import_tasks: assign-address.yml

- name: Wait for the client to adopt the declared address
  ansible.builtin.command: netbird status --json
  register: netbird_after
  changed_when: false
  until: >-
    netbird_after.rc == 0 and
    (netbird_after.stdout | from_json).management.connected | default(false) and
    ((netbird_after.stdout | from_json).netbirdIp | default('') | regex_replace('/.*$', '')) == netbird_ip
  retries: 12
  delay: 5

- name: Wait for the declared address on the NetBird interface
  ansible.builtin.command:
    argv: [ip, -j, -4, address, show, dev, "{{ netbird_interface }}"]
  register: netbird_interface_state
  changed_when: false
  until: >-
    netbird_interface_state.rc == 0 and
    netbird_ip in (netbird_interface_state.stdout | from_json |
                  map(attribute='addr_info') | flatten | map(attribute='local') | list)
  retries: 12
  delay: 5

- name: Create the enrollment record directory
  ansible.builtin.file:
    path: "{{ netbird_enrollment_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Record verified enrollment for unattended reconnects after daemon restarts
  ansible.builtin.copy:
    dest: "{{ netbird_enrollment_marker }}"
    content: "{{ {'management_url': netbird_management_url} | to_nice_json }}\n"
    owner: root
    group: root
    mode: '0600'
