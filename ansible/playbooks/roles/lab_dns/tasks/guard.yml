---
- name: Restrict host-local DNS to an explicit isolated test deployment
  ansible.builtin.assert:
    that:
      - lab_dns_state in ['present', 'absent']
      - inventory_hostname in (groups.get('test_env', []) + groups.get('isolated_test_vps', []))
      - inventory_hostname not in groups.get('prod_env', [])
      - netbird_server_group == 'test-servers'
      - netbird_subnet == '100.91.0.0/16'
    fail_msg: Lab DNS requires explicit test inventory and the test VPN account.

- name: Validate private resolver inputs without logging names
  ansible.builtin.set_fact:
    lab_dns_desired: >-
      {{ lab_dns_namespace | lab_dns_plan(lab_dns_listen_address, lab_dns_records,
         lab_dns_upstreams, netbird_management_url, lab_dns_state) }}
  no_log: true

