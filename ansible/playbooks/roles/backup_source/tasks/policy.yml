---
- name: Prepare endpoint-bound NetBird API context
  ansible.builtin.import_tasks: ../../netbird_client/tasks/api-context.yml
- name: Reconcile the exact backup source and destination without broadening shared policies
  delegate_to: localhost
  become: false
  no_log: true
  block:
    - name: Read enrolled peers and existing policy state
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/{{ item }}'
        headers: '{{ netbird_api_headers }}'
        status_code: 200
      loop: [groups, peers, policies]
      register: hou1_backup_api

    - name: Plan the two exact backup groups
      ansible.builtin.set_fact:
        hou1_backup_plan: '{{ hou1_backup_api.results[0].json | netbird_backup_plan(hou1_backup_api.results[1].json, hou1_backup_api.results[2].json, hou1_backup_receiver_ip, netbird_ip, netbird_subnet, hou1_backup_environment) }}'

    - name: Create only missing backup peer groups
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/groups'
        headers: '{{ netbird_api_headers }}'
        method: POST
        body_format: json
        body: '{{ item.body }}'
        status_code: 200
      loop: '{{ hou1_backup_plan.groups }}'
      when: item.id is none
      changed_when: true

    - name: Read back exact backup groups
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/groups'
        headers: '{{ netbird_api_headers }}'
        status_code: 200
      register: hou1_backup_groups

    - name: Plan the single direction and single port policy
      ansible.builtin.set_fact:
        hou1_backup_plan: '{{ hou1_backup_groups.json | netbird_backup_plan(hou1_backup_api.results[1].json, hou1_backup_api.results[2].json, hou1_backup_receiver_ip, netbird_ip, netbird_subnet, hou1_backup_environment) }}'

    - name: Apply only the marked backup policy
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/policies{{ "/" ~ hou1_backup_plan.policy.id if hou1_backup_plan.policy.id else "" }}'
        headers: '{{ netbird_api_headers }}'
        method: '{{ "PUT" if hou1_backup_plan.policy.id else "POST" }}'
        body_format: json
        body: '{{ hou1_backup_plan.policy.body }}'
        status_code: 200
      when: hou1_backup_plan.policy.changed
      changed_when: true

    - name: Verify backup policy readback
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/policies'
        headers: '{{ netbird_api_headers }}'
        status_code: 200
      register: hou1_backup_policies

    - name: Require exact policy contents and membership after reconciliation
      ansible.builtin.assert:
        that: not (hou1_backup_groups.json | netbird_backup_plan(hou1_backup_api.results[1].json, hou1_backup_policies.json, hou1_backup_receiver_ip, netbird_ip, netbird_subnet, hou1_backup_environment)).policy.changed
