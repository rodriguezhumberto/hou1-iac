---
# Runs on the production host over SSH. No host listener, forwarded setup
# headers or public bootstrap allowlist is needed for this private request.
- name: Locate the running NetBird server container
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - "{{ netbird_control_plane_project }}"
      - -f
      - compose.yaml
      - ps
      - --quiet
      - netbird-server
    chdir: "{{ netbird_control_plane_directory }}"
  register: netbird_bootstrap_container_id
  changed_when: false

- name: Require exactly one NetBird server container
  ansible.builtin.assert:
    that: netbird_bootstrap_container_id.stdout is match('^[a-f0-9]{12,64}$')
    fail_msg: Cannot safely identify the running NetBird server for owner bootstrap.

- name: Inspect the private NetBird server address
  community.docker.docker_container_info:
    name: "{{ netbird_bootstrap_container_id.stdout }}"
  register: netbird_bootstrap_container

- name: Require an address on the dedicated ingress network
  ansible.builtin.assert:
    that:
      - netbird_bootstrap_container.exists
      - netbird_ingress_network in netbird_bootstrap_container.container.NetworkSettings.Networks
      - netbird_bootstrap_container.container.NetworkSettings.Networks[netbird_ingress_network].IPAddress is ansible.utils.ipv4
      - netbird_bootstrap_container.container.NetworkSettings.Networks[netbird_ingress_network].IPAddress is ansible.utils.in_network(netbird_ingress_subnet)
    fail_msg: NetBird is not reachable on its expected private Docker network.

- name: Select the private API for owner bootstrap
  ansible.builtin.set_fact:
    netbird_bootstrap_api_url: "http://{{ netbird_bootstrap_container.container.NetworkSettings.Networks[netbird_ingress_network].IPAddress }}:80"

- name: Read the NetBird setup state over the private network
  ansible.builtin.uri:
    url: "{{ netbird_bootstrap_api_url }}/api/instance"
    method: GET
    status_code: 200
    return_content: true
    use_proxy: false
    follow_redirects: none
    unredirected_headers: [Authorization]
  register: netbird_instance_state
  until: netbird_instance_state.json.setup_required is defined
  retries: 12
  delay: 5

- name: Require an explicit boolean setup state before sending owner credentials
  ansible.builtin.assert:
    that:
      - netbird_instance_state.json.setup_required is boolean
    fail_msg: Refusing bootstrap because the server did not return a valid setup state.

- name: Require owner variables only while the instance is uninitialized
  ansible.builtin.assert:
    that:
      - netbird_owner_email | default('') is match('^[^\s@]+@[^\s@]+\.[^\s@]+$')
      - netbird_owner_name | default('') | trim | length > 0
      - netbird_owner_password | default('') | length >= 8
      - netbird_owner_password | default('') | length <= 72
    fail_msg: Provide valid NetBird owner values in the encrypted Vault before bootstrap.
  when: netbird_instance_state.json.setup_required
  no_log: true

- name: Create the initial NetBird owner through the private setup API
  ansible.builtin.uri:
    url: "{{ netbird_bootstrap_api_url }}/api/setup"
    method: POST
    body_format: json
    body:
      email: "{{ netbird_owner_email }}"
      name: "{{ netbird_owner_name }}"
      password: "{{ netbird_owner_password }}"
      create_pat: false
    status_code: 200
    return_content: false
    use_proxy: false
    follow_redirects: none
  when: netbird_instance_state.json.setup_required
  changed_when: true
  no_log: true

- name: Verify the initial owner setup completed
  ansible.builtin.uri:
    url: "{{ netbird_bootstrap_api_url }}/api/instance"
    method: GET
    status_code: 200
    return_content: true
    use_proxy: false
    follow_redirects: none
  register: netbird_instance_after_setup
  until: >-
    netbird_instance_after_setup.json.setup_required is defined and
    netbird_instance_after_setup.json.setup_required is sameas false
  retries: 6
  delay: 3
  when: netbird_instance_state.json.setup_required
  no_log: true
