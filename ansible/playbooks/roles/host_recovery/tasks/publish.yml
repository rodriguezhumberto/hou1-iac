---
- name: Validate optional recovery transports before opening ingress or retiring peers
  ansible.builtin.include_tasks: roles/host_recovery/tasks/transport-preflight.yml

- name: Publish once or validate the retained successful publication checkpoint
  ansible.builtin.include_tasks: roles/host_recovery/tasks/publication-checkpoint.yml

- name: Replace only the explicitly selected lost host peer
  delegate_to: localhost
  become: false
  no_log: true
  block:
    - name: Load the retained controller API token
      netbird_token_vault:
        path: '{{ netbird_token_vault_file }}'
        management_url: '{{ netbird_management_url }}'
        age_key_file: '{{ netbird_token_age_key_file }}'
        recovery_recipients: '{{ netbird_token_recovery_recipients }}'
      register: host_recovery_api_token
    - name: Require the existing token rather than creating a new account
      ansible.builtin.assert:
        that: host_recovery_api_token.exists
    - name: Prepare the existing authenticated API context
      ansible.builtin.include_tasks: roles/netbird_common/tasks/api-context.yml
      vars:
        netbird_api_context_url: '{{ netbird_management_url }}'
        netbird_api_context_token: '{{ host_recovery_api_token.token }}'
    - name: Retire only the pinned lost peer or resume its original handoff
      ansible.builtin.include_tasks: roles/host_recovery/tasks/peer-retirement.yml

- name: Verify saved replacement identity and address occupancy before enrollment
  ansible.builtin.include_tasks: roles/host_recovery/tasks/replacement-preflight.yml

- name: Recheck pinned groups and policies before any initial or resumed enrollment
  ansible.builtin.include_tasks: roles/host_recovery/tasks/group-plan-preflight.yml

- name: Enroll the replacement through the existing pinned client role
  ansible.builtin.include_role:
    name: netbird_client
- name: Persist the exact verified replacement before binding its groups
  ansible.builtin.include_tasks: roles/host_recovery/tasks/replacement-receipt.yml
- name: Reattach only the pinned lost peer's managed source groups
  delegate_to: localhost
  become: false
  no_log: true
  block:
    - name: Verify empty groups and bind the enrolled replacement
      ansible.builtin.include_tasks: roles/host_recovery/tasks/peer-groups-after.yml
- name: Reconcile private DNS through the existing role
  ansible.builtin.include_role:
    name: netbird_dns
- name: Refresh an explicitly configured dedicated controller VPN transport
  ansible.builtin.include_tasks: roles/host_recovery/tasks/refresh-management.yml
- name: Refresh an explicitly configured companion through independent access
  ansible.builtin.include_tasks: roles/host_recovery/tasks/refresh-companion.yml
- name: Verify private SSH before retiring bootstrap access
  ansible.builtin.include_role:
    name: security
  vars:
    security_netbird_wait_before_cutover: true
- name: Use the verified private management path for subsequent tasks
  ansible.builtin.set_fact:
    ansible_host: '{{ netbird_ip }}'
    ansible_user: '{{ new_user }}'
    node_bootstrap: false
- name: Reconnect through the verified VPN path
  ansible.builtin.meta: reset_connection
- name: Restore existing monitoring probes and persistent isolation
  ansible.builtin.include_role:
    name: rehearsal_gates
  when: cms_environment == 'test'
