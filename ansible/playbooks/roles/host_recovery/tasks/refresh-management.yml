---
# Both publication entry points validate their environment before this include.
- name: Validate the explicitly selected controller transport
  ansible.builtin.include_tasks: management-refresh-preflight.yml

- name: Refresh the dedicated controller transport after replacing the remote peer key
  ansible.builtin.command:
    argv: '{{ host_recovery_management_refresh_argv }}'
  delegate_to: localhost
  become: false
  timeout: 120
  changed_when: true
  no_log: true
  when: host_recovery_management_refresh_argv is defined
