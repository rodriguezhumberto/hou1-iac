---
- name: Read the pinned recovery groups after replacement enrollment
  ansible.builtin.uri:
    url: '{{ netbird_api_url }}/api/groups/{{ item.id }}'
    headers: '{{ netbird_api_headers }}'
    status_code: 200
  loop: '{{ host_recovery_source_groups }}'
  register: host_recovery_empty_groups

- name: Refuse changed group identity or membership before reassignment
  ansible.builtin.assert:
    that:
      - netbird_server_peer.id != host_recovery_lost_peer_id
      - netbird_server_peer.ip == netbird_ip
      - item.json.id == item.item.id
      - item.json.name == item.item.name
      - >-
        (item.json.peers | default([], true) | map(attribute='id') | sort | list) in
        [(item.item.peers | default([]) | sort | list),
         ((item.item.peers | default([]) + [netbird_server_peer.id]) | sort | list)]
      - item.json.resources | default([], true) | length == 0
    fail_msg: A pinned recovery group changed; do not overwrite other access.
  loop: '{{ host_recovery_empty_groups.results }}'

- name: Read policies again before binding a replacement peer
  ansible.builtin.uri:
    url: '{{ netbird_api_url }}/api/policies'
    headers: '{{ netbird_api_headers }}'
    status_code: 200
  register: host_recovery_policies_after

- name: Recheck renewal ownership and other receivers before reassignment
  when: host_recovery_renewal_handoff | default(false) | bool
  block:
    - name: Read current renewal group and peer membership
      ansible.builtin.uri:
        url: '{{ netbird_api_url }}/api/{{ item }}'
        headers: '{{ netbird_api_headers }}'
        status_code: 200
      loop: [groups, peers]
      register: host_recovery_renewal_state_after
    - name: Refuse changed renewal source, receivers or policy
      ansible.builtin.assert:
        # NetBird updates group display counts when the lost peer is removed.
        # Keep historical receipt bodies intact and compare their actual grants.
        that:
          - current.id == host_recovery_renewal_group.id
          - current.name == host_recovery_renewal_group.name
          - current.peers == host_recovery_renewal_group.peers
          - current.source == host_recovery_renewal_group.source
          - current.policy.id == host_recovery_renewal_group.policy.id
          - >-
            (current.policy.body | netbird_policy_body) ==
            (host_recovery_renewal_group.policy.body | netbird_policy_body)
      vars:
        current: >-
          {{ host_recovery_renewal_state_after.results[0].json |
             host_recovery_renewal_plan(host_recovery_renewal_state_after.results[1].json,
             host_recovery_policies_after.json, hou1_tls_peer_config,
             cms_environment, netbird_ip, netbird_server_peer.id, host_recovery_renewal_peer_id, true) }}

- name: Refuse changed policy ownership or grants before reassignment
  ansible.builtin.assert:
    that:
      - matches | length == 1
      - matches[0] | netbird_policy_body == item.policy.body | netbird_policy_body
    fail_msg: A pinned managed policy changed; do not attach the replacement.
  vars:
    matches: '{{ host_recovery_policies_after.json | selectattr("id", "equalto", item.policy.id) | list }}'
  loop: '{{ host_recovery_source_groups }}'

- name: Bind only the enrolled replacement while preserving other pinned receivers
  ansible.builtin.uri:
    url: '{{ netbird_api_url }}/api/groups/{{ item.item.id }}'
    headers: '{{ netbird_api_headers }}'
    method: PUT
    body_format: json
    body:
      name: '{{ item.item.name }}'
      peers: '{{ item.item.peers | default([]) + [netbird_server_peer.id] }}'
      resources: []
    status_code: 200
  loop: '{{ host_recovery_empty_groups.results }}'
  when: >-
    (item.json.peers | default([], true) | map(attribute='id') | sort | list) !=
    ((item.item.peers | default([]) + [netbird_server_peer.id]) | sort | list)
  changed_when: true

- name: Read back the pinned source groups
  ansible.builtin.uri:
    url: '{{ netbird_api_url }}/api/groups/{{ item.id }}'
    headers: '{{ netbird_api_headers }}'
    status_code: 200
  loop: '{{ host_recovery_source_groups }}'
  register: host_recovery_bound_groups

- name: Require only the new peer without changing group identity
  ansible.builtin.assert:
    that:
      - item.json.id == item.item.id
      - item.json.name == item.item.name
      - (item.json.peers | map(attribute='id') | sort | list) == ((item.item.peers | default([]) + [netbird_server_peer.id]) | sort | list)
      - item.json.resources | default([], true) | length == 0
  loop: '{{ host_recovery_bound_groups.results }}'
