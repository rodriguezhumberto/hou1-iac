---
- name: Read the two pinned source groups after replacement enrollment
  ansible.builtin.uri:
    url: '{{ netbird_api_url }}/api/groups/{{ item.id }}'
    headers: '{{ netbird_api_headers }}'
    status_code: 200
  loop: '{{ host_recovery_source_groups }}'
  register: host_recovery_empty_groups

- name: Refuse changed group identity or membership before reassignment
  ansible.builtin.assert:
    that:
      - netbird_server_peer.id != host_recovery_lost_peer_id
      - netbird_server_peer.ip == netbird_ip
      - item.json.id == item.item.id
      - item.json.name == item.item.name
      - item.json.peers | default([], true) | length == 0
      - item.json.resources | default([], true) | length == 0
    fail_msg: A pinned recovery group changed; do not overwrite other access.
  loop: '{{ host_recovery_empty_groups.results }}'

- name: Read policies again before binding a replacement peer
  ansible.builtin.uri:
    url: '{{ netbird_api_url }}/api/policies'
    headers: '{{ netbird_api_headers }}'
    status_code: 200
  register: host_recovery_policies_after

- name: Refuse changed policy ownership or grants before reassignment
  ansible.builtin.assert:
    that:
      - matches | length == 1
      - matches[0] | netbird_policy_body == item.policy.body | netbird_policy_body
    fail_msg: A pinned managed policy changed; do not attach the replacement.
  vars:
    matches: '{{ host_recovery_policies_after.json | selectattr("id", "equalto", item.policy.id) | list }}'
  loop: '{{ host_recovery_source_groups }}'

- name: Bind only the enrolled replacement to the two empty source groups
  ansible.builtin.uri:
    url: '{{ netbird_api_url }}/api/groups/{{ item.id }}'
    headers: '{{ netbird_api_headers }}'
    method: PUT
    body_format: json
    body:
      name: '{{ item.name }}'
      peers: ['{{ netbird_server_peer.id }}']
      resources: []
    status_code: 200
  loop: '{{ host_recovery_source_groups }}'
  changed_when: true

- name: Read back the pinned source groups
  ansible.builtin.uri:
    url: '{{ netbird_api_url }}/api/groups/{{ item.id }}'
    headers: '{{ netbird_api_headers }}'
    status_code: 200
  loop: '{{ host_recovery_source_groups }}'
  register: host_recovery_bound_groups

- name: Require only the new peer without changing group identity
  ansible.builtin.assert:
    that:
      - item.json.id == item.item.id
      - item.json.name == item.item.name
      - item.json.peers | map(attribute='id') | list == [netbird_server_peer.id]
      - item.json.resources | default([], true) | length == 0
  loop: '{{ host_recovery_bound_groups.results }}'
