---
- name: Select shared ingress for certificate validation and reload
  ansible.builtin.import_role:
    name: shared_ingress
    tasks_from: selector

- name: Create root-only receiver state and configuration
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: [/etc/hou1-tls, /var/lib/hou1-tls]

- name: Create shared executable directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure the fixed environment certificate allowlist
  ansible.builtin.copy:
    dest: /etc/hou1-tls/receiver.json
    content: "{{ {'environment': cms_environment, 'app_directory': app_directory, 'certificate_directory': app_directory ~ '/certbot/conf', 'lineages': hou1_tls_lineages, 'ingress_compose': shared_ingress_compose_selector} | to_nice_json }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Install the shared receiver implementation
  ansible.builtin.import_tasks: receiver-programs.yml
