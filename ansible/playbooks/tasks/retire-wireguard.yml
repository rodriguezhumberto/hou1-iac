---
- name: Discover installed service units
  ansible.builtin.service_facts:

- name: Stop and disable the legacy VPN interface
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: stopped
    enabled: false
  when: "'wg-quick@wg0.service' in ansible_facts.services"

- name: Remove legacy VPN firewall allowances
  community.general.ufw:
    delete: true
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src | default('any') }}"
    interface: "{{ item.interface | default(omit) }}"
    direction: in
  loop:
    - {port: '51820', proto: udp}
    - {port: '22', proto: tcp, src: '10.10.0.0/24', interface: wg0}
    - {port: '22', proto: tcp, src: '10.10.0.0/24'}

- name: Remove the legacy VPN interface configuration
  ansible.builtin.file:
    path: /etc/wireguard/wg0.conf
    state: absent

- name: Remove legacy VPN packages without removing the kernel or NetBird
  ansible.builtin.apt:
    name: [wireguard, wireguard-tools]
    state: absent
    purge: true
    autoremove: false
