---
- name: Rebuild HOU1 Infrastructure
  hosts: "{{ target_hosts | default('hou1_test') }}"
  become: yes
  module_defaults:
    ansible.builtin.uri:
      use_proxy: false
      follow_redirects: none

  pre_tasks:
    - name: Validate host configuration for every run, including tagged runs
      ansible.builtin.import_role:
        name: netbird_common
      tags: [always]

  roles:
    - role: common
      tags: ['init', 'common']
      
    - role: docker
      tags: ['docker']

    - role: netbird_client
      tags: ['netbird', 'network', 'security', 'ufw', 'ssh']

    - role: security
      tags: ['security', 'ufw', 'ssh']

    - role: webstack
      tags: ['deploy', 'webstack', 'ssl']
