---
- name: Rebuild HOU1 Infrastructure
  hosts: "{{ target_hosts | default('hou1_test') }}"
  become: yes

  pre_tasks:
    - name: Validate VPN configuration for every run, including tagged runs
      ansible.builtin.import_role:
        name: management_vpn
      tags: [always]

  roles:
    - role: common
      tags: ['init', 'common']
      
    - role: wireguard
      tags: ['wireguard', 'network']

    - role: docker
      tags: ['docker']

    - role: netbird_client
      tags: ['netbird', 'network']
      when: netbird_enabled | bool

    - role: security
      tags: ['security', 'ufw', 'ssh']

    - role: webstack
      tags: ['deploy', 'webstack', 'ssl']
