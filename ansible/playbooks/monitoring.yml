---
- name: Export declared HOU1 metrics privately to HOU4
  hosts: "{{ hou1_monitoring_inventory_group | default('monitoring_targets') }}"
  become: true
  gather_facts: true
  module_defaults:
    ansible.builtin.uri:
      use_proxy: false
      follow_redirects: none
  pre_tasks:
    - name: Validate existing private management
      ansible.builtin.import_role:
        name: netbird_common
  roles:
    - role: monitoring_exporter
