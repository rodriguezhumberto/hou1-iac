---
- name: Export declared HOU1 metrics privately to HOU4
  hosts: "{{ hou1_monitoring_inventory_group | default('monitoring_targets') }}"
  become: true
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      use_proxy: false
      follow_redirects: none
  pre_tasks:
    - name: Validate inventory targeting before any connection or controller changes
      ansible.builtin.import_tasks: tasks/validate-target.yml
      tags: [always]
    - name: Validate existing private management
      ansible.builtin.import_role:
        name: netbird_common
      tags: [always]
    - name: Gather host facts after validating the target
      ansible.builtin.setup:
      tags: [always]

  roles:
    - role: monitoring_exporter
