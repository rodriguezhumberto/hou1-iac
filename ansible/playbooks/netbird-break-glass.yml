---
- name: Install NetBird and Authentik break-glass recovery
  hosts: netbird_control_plane
  become: true
  pre_tasks:
    - name: Validate NetBird management
      ansible.builtin.import_role:
        name: netbird_common
      tags: [always]
    - name: Require the dedicated production target before host changes
      ansible.builtin.import_tasks: roles/netbird_control_plane/tasks/target.yml
      tags: [always]
  tasks:
    - name: Install break-glass recovery command
      ansible.builtin.import_tasks: roles/netbird_control_plane/tasks/break-glass.yml
