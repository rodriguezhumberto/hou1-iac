---
- name: Validate the HOU1 host before Authentik placement
  hosts: "{{ target_hosts | default('hou1_prod') }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Validate inventory targeting before any connection or controller changes
      ansible.builtin.import_tasks: tasks/validate-target.yml
      tags: [always]
    - name: Gather host facts after validating the target
      ansible.builtin.setup:
      tags: [always]

  roles:
    - role: authentik_policy
      tags: [authentik, capacity, firewall, isolation]
