---
- name: Bootstrap Authentik identity data for one isolated environment
  hosts: "{{ target_hosts | default('hou1_test') }}"
  become: true
  vars:
    authentik_environment: "{{ deploy_environment | default('test') }}"
    authentik_secret_source: "{{ playbook_dir }}/../secrets/authentik-{{ authentik_environment }}.enc.yaml"
    authentik_bootstrap_enabled: true
    authentik_api_url: "https://{{ authentik_identity_profiles[authentik_environment].issuer_host }}"
  roles:
    - role: authentik
      tags: [authentik, bootstrap, identity]
