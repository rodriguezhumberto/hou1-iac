---
- name: Publish reviewed recovery and restore private host management
  hosts: isolated_test_vps
  become: true
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      use_proxy: false
      follow_redirects: none
  pre_tasks:
    - name: Require the explicit completed test restore and reviewed access changes
      ansible.builtin.assert:
        that:
          - groups['isolated_test_vps'] | length == 1
          - inventory_hostname not in groups.get('prod_env', [])
          - cms_environment == 'test'
          - node_bootstrap | bool
          - ansible_host == test_vps_public_ip
          - host_recovery_id is match('^[a-z0-9][a-z0-9-]{5,39}$')
          - host_recovery_console_confirmed | bool
          - host_recovery_access_reviewed | default(false) | bool
          - host_recovery_lost_peer_id is match('^[a-zA-Z0-9_-]+$')
          - host_recovery_lost_peer_name | length > 0
          - not ansible_check_mode
          - ansible_run_tags | list == ['all']
          - ansible_skip_tags | length == 0
        fail_msg: Reconcile post-backup authorization changes and select only the lost HOU1 peer before publishing.
    - name: Validate the existing test management configuration
      ansible.builtin.import_role:
        name: netbird_common
  tasks:
    - name: Publish and restore management through shared recovery tasks
      ansible.builtin.include_tasks: roles/host_recovery/tasks/publish.yml
