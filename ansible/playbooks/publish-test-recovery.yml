---
- name: Publish reviewed recovery and restore private host management
  hosts: isolated_test_vps
  become: true
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      use_proxy: false
      follow_redirects: none
  pre_tasks:
    - name: Require the explicit completed test restore and reviewed access changes
      ansible.builtin.assert:
        that:
          - groups['isolated_test_vps'] | length == 1
          - inventory_hostname not in groups.get('prod_env', [])
          - cms_environment == 'test'
          - node_bootstrap | bool
          - ansible_host == test_vps_public_ip
          - host_recovery_id is match('^[a-z0-9][a-z0-9-]{5,39}$')
          - host_recovery_console_confirmed | bool
          - host_recovery_access_reviewed | default(false) | bool
          - host_recovery_lost_peer_id is match('^[a-zA-Z0-9_-]+$')
          - host_recovery_lost_peer_name | length > 0
          - not ansible_check_mode
          - ansible_run_tags | list == ['all']
          - ansible_skip_tags | length == 0
        fail_msg: Reconcile post-backup authorization changes and select only the lost HOU1 peer before publishing.
    - name: Validate the existing test management configuration
      ansible.builtin.import_role:
        name: netbird_common
  tasks:
    - name: Publish only the previously restored ingress and STUN ports
      ansible.builtin.command:
        argv: [python3, '/var/lib/hou1-host-recovery/{{ host_recovery_id }}/restore.py', publish]
      no_log: true
      changed_when: true

    - name: Replace only the explicitly selected lost host peer
      delegate_to: localhost
      become: false
      no_log: true
      block:
        - name: Load the retained controller API token
          netbird_token_vault:
            path: '{{ netbird_token_vault_file }}'
            management_url: '{{ netbird_management_url }}'
            vault_id: '{{ netbird_token_vault_id }}'
            age_key_file: '{{ netbird_token_age_key_file }}'
          register: host_recovery_api_token
        - name: Require the existing token rather than creating a new account
          ansible.builtin.assert:
            that: host_recovery_api_token.exists
        - name: Prepare the existing authenticated API context
          ansible.builtin.include_tasks: roles/netbird_common/tasks/api-context.yml
          vars:
            netbird_api_context_url: '{{ netbird_management_url }}'
            netbird_api_context_token: '{{ host_recovery_api_token.token }}'
        - name: Read only the pinned lost HOU1 peer
          ansible.builtin.uri:
            url: '{{ netbird_api_url }}/api/peers/{{ host_recovery_lost_peer_id }}'
            headers: '{{ netbird_api_headers }}'
            status_code: 200
          register: host_recovery_old_peer
        - name: Refuse another device or a connected peer
          ansible.builtin.assert:
            that:
              - host_recovery_old_peer.json.id == host_recovery_lost_peer_id
              - host_recovery_old_peer.json.ip == netbird_ip
              - host_recovery_old_peer.json.name == host_recovery_lost_peer_name
              - not (host_recovery_old_peer.json.connected | bool)
            fail_msg: The selected peer is not the disconnected lost HOU1 identity.
        - name: Retire that lost peer to release its declared address
          ansible.builtin.uri:
            url: '{{ netbird_api_url }}/api/peers/{{ host_recovery_lost_peer_id }}'
            headers: '{{ netbird_api_headers }}'
            method: DELETE
            status_code: 200
          changed_when: true

    - name: Enroll the replacement through the existing pinned client role
      ansible.builtin.include_role:
        name: netbird_client
    - name: Reconcile private DNS through the existing role
      ansible.builtin.include_role:
        name: netbird_dns
    - name: Wait for the restored VPN path before changing SSH listeners
      ansible.builtin.include_tasks: roles/security/tasks/verify-access.yml
      vars:
        security_netbird_wait_for_transport: true
    - name: Verify private SSH before retiring bootstrap access
      ansible.builtin.include_role:
        name: security
    - name: Use the verified private management path for subsequent tasks
      ansible.builtin.set_fact:
        ansible_host: '{{ netbird_ip }}'
        ansible_user: '{{ new_user }}'
        node_bootstrap: false
    - name: Reconnect through the verified VPN path
      ansible.builtin.meta: reset_connection
    - name: Restore existing monitoring probes and persistent isolation
      ansible.builtin.include_role:
        name: rehearsal_gates
